name: own trial image

on:
  workflow_call:
    inputs:
      publish:
        description: Publish the exact tested image
        required: false
        type: boolean
        default: false

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 90
    outputs:
      source: ${{ steps.source.outputs.sha }}
      drv: ${{ steps.source.outputs.drv }}
    steps:
      # Test the exact PR head, not the refs/pull/N/merge commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          # The legacy migration below reads the base commit's binding.
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: Record source commit and own-image drvPath
        id: source
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          drv="$(nix eval --raw .#own-image.drvPath --no-write-lock-file)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "drv=$drv" >> "$GITHUB_OUTPUT"
          printf 'source %s\ndrvPath %s\nworkflow blob %s\n' "$sha" "$drv" "$(git rev-parse HEAD:.github/workflows/own-image.yml)" >> "$GITHUB_STEP_SUMMARY"
      - name: Evaluate flake checks
        run: nix flake check --no-write-lock-file --print-build-logs
      - name: Plan and fake-WSLC Replace of the own Windows script (no WSLC, no live effect)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Path = "$PWD/hosts/own/win.ps1"
          $Errors = $null
          $Ast = [System.Management.Automation.Language.Parser]::ParseFile($Path, [ref] $null, [ref] $Errors)
          if ($Errors) { $Errors; exit 1 }
          $env:COMPUTERNAME = 'CI-HOST'
          # Test setup only: Linux has no C: drive, so the script's fixed WSLC path is rooted in an existing directory.
          $env:ProgramFiles = $env:RUNNER_TEMP
          $Binding = (New-TemporaryFile).FullName
          $B = Get-Content hosts/own/bindings/G6I3.json -Raw | ConvertFrom-Json
          $B.expectHost = 'CI-HOST'
          $B | ConvertTo-Json | Set-Content $Binding
          $Plan = (& $Path -Step Plan -Binding $Binding) | ConvertFrom-Json
          $W = $Plan.pull[0]
          if ($W -notlike '*WSL?wslc.exe') { "unexpected WSLC path $W"; exit 1 }
          $Image = $B.image
          $Want = [ordered]@{
            create = @($W, 'run', '--name', 'windows-own', '--detach', '--publish', '127.0.0.1:2223:2223', '--shm-size', '1G',
              '--volume', 'windows-own-home:/home/dev', '--volume', 'windows-own-work:/work/repos', '--volume', 'windows-own-nix:/nix',
              '--env', 'OWN_HOME_VOLUME=windows-own-home', '--env', 'OWN_WORK_VOLUME=windows-own-work', '--env', 'OWN_NIX_VOLUME=windows-own-nix',
              '--env', "OWN_AUTHORIZED_KEY=<contents of $([Environment]::ExpandEnvironmentVariables($B.publicKeyFile))>", $Image)
            seed = @($W, 'run', '--rm', '--volume', 'windows-own-nix:/seed', '--env', 'OWN_NIX_VOLUME=windows-own-nix', $Image, '/bin/own-nix-seed')
            workVolumeCreateOnce = @($W, 'volume', 'create', 'windows-own-work')
            nixVolumeCreateOnce = @($W, 'volume', 'create', 'windows-own-nix')
          }
          foreach ($K in $Want.Keys) {
            if ((@($Plan.$K) -join "`n") -cne ($Want[$K] -join "`n")) { "$K differs: $(@($Plan.$K) -join ' ')"; exit 1 }
          }
          if ($Plan.postGate -notlike "*'own-mounts ok home=windows-own-home work=windows-own-work nix=windows-own-nix'*") { 'postGate differs'; exit 1 }
          foreach ($Bad in @(@{ workVolume = 'windows-own-home' }, @{ nixVolume = 'windows-own-work' }, @{ nixVolume = 'Bad Name' })) {
            $C = Get-Content $Binding -Raw | ConvertFrom-Json
            foreach ($K in $Bad.Keys) { $C.$K = $Bad[$K] }
            $F = (New-TemporaryFile).FullName; $C | ConvertTo-Json | Set-Content $F
            $Refused = $false
            try { & $Path -Step Plan -Binding $F | Out-Null } catch { $Refused = $true }
            if (-not $Refused) { "not refused: $($Bad | ConvertTo-Json -Compress)"; exit 1 }
          }
          # Replace on a fake WSLC, with the script's own functions and values.
          $Site = $B; $Spec = Get-Content hosts/own/spec.json -Raw | ConvertFrom-Json
          foreach ($N in $Ast.FindAll({ param($n)
              ($n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -in 'Get-Own', 'Get-Images', 'Test-RunningProof',
                'Wait-RunningProof', 'Get-RollbackProblem', 'Wait-OldRunning', 'Invoke-Seed', 'Complete-Replace') -or
              ($n -is [System.Management.Automation.Language.AssignmentStatementAst] -and $n.Left.Extent.Text -in '$Volumes', '$Proof') }, $true)) {
            . ([scriptblock]::Create($N.Extent.Text))
          }
          function Start-Sleep { }
          $RunArgs = @($Plan.create | Select-Object -Skip 1); $SeedArgs = @($Plan.seed | Select-Object -Skip 1)
          $OldImage = 'ghcr.io/roccho-dev/windows-own@sha256:' + ('1' * 64)
          $Old = [pscustomobject] @{ Name = 'windows-own'; Config = [pscustomobject] @{ Image = $OldImage } }
          $Pre = @('run', '--name', 'windows-own', '--detach', '--publish', '127.0.0.1:2223:2223', '--shm-size', '1G')
          $Good = $Pre + @('--volume', 'windows-own-home:/home/dev', $OldImage)
          # The forms this script has actually run: the one-volume trial runtime (with its key and trial env) and the new one.
          $Three = $Pre + @('--volume', 'windows-own-home:/home/dev', '--volume', 'windows-own-work:/work/repos', '--volume', 'windows-own-nix:/nix',
            '--env', 'OWN_HOME_VOLUME=windows-own-home', '--env', 'OWN_WORK_VOLUME=windows-own-work', '--env', 'OWN_NIX_VOLUME=windows-own-nix',
            '--env', 'OWN_AUTHORIZED_KEY=ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIA== ci', $OldImage)
          $Trial = $Pre + @('--volume', 'windows-own-home:/home/dev', '--env', 'OWN_AUTHORIZED_KEY=ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIA== ci',
            '--env', 'OWN_TRIAL_UNSANDBOXED=1', $OldImage)
          foreach ($Ok in @(, $Trial)) { if (Get-RollbackProblem $Ok $Old) { "trial rollback argv refused: $(Get-RollbackProblem $Ok $Old)"; exit 1 } }
          foreach ($Ok in @(, $Good) + @(, $Three)) { if (Get-RollbackProblem $Ok $Old) { "good rollback argv refused: $(Get-RollbackProblem $Ok $Old)"; exit 1 } }
          $H = @('--volume', 'windows-own-home:/home/dev')
          foreach ($Bad in @(@('run', '--rm', '--name', 'windows-own', $OldImage), @('run', '--name', 'other', '--detach', $OldImage),
              @('run', '--name', 'windows-own', '--detach', $Image), ($Pre + $H + @('--env', 'GH_TOKEN=x', $OldImage)),
              # Not the exact old target: SSH port, home volume, an extra or partial volume set, or other flag forms.
              (@('run', '--name', 'windows-own', '--detach', '--publish', '127.0.0.1:2224:2223') + $H + @($OldImage)),
              (@('run', '--name', 'windows-own', '--detach') + $H + @($OldImage)),
              ($Pre + @('--publish', '127.0.0.1:14500:14500') + $H + @($OldImage)),
              ($Pre + @('--volume', 'other-home:/home/dev', $OldImage)),
              ($Pre + @('--volume', 'windows-own-home:/root', $OldImage)),
              ($Pre + $H + @('--volume', 'extra:/extra', $OldImage)),
              ($Pre + $H + @('--volume', 'windows-own-nix:/nix', $OldImage)),
              ($Pre + @('-v', 'windows-own-home:/home/dev', $OldImage)),
              (@('run', '--name', 'windows-own', '-p', '127.0.0.1:2223:2223') + $H + @($OldImage)),
              # A persistent old own, not merely exit 0: exactly one --detach, no other options, allowlisted env only.
              (@('run', '--name', 'windows-own', '--publish', '127.0.0.1:2223:2223', '--shm-size', '1G') + $H + @($OldImage)),
              ($Pre + @('--detach') + $H + @($OldImage)),
              ($Pre + @('--entrypoint', '/bin/true') + $H + @($OldImage)),
              ($Pre + @('--user', '0') + $H + @($OldImage)),
              ($Pre + @('--restart', 'always') + $H + @($OldImage)),
              ($Pre + @('--env', 'FOO=1') + $H + @($OldImage)),
              ($Pre + @('--shm-size', '2G') + $H + @($OldImage)),
              ($Pre + @('--name', 'windows-own') + $H + @($OldImage)),
              ($Pre + $H + @('--env')  + @($OldImage)),
              ($Pre + $H + @($OldImage, '/bin/true')))) {
            if (-not (Get-RollbackProblem $Bad $Old)) { "bad rollback argv allowed: $($Bad -join ' ')"; exit 1 }
          }
          $NewUp = '{"Name":"windows-own","State":{"Running":true}}'
          $Wslc = {
            $A = @($args) -join ' '
            $Calls.Add($A)
            $global:LASTEXITCODE = if ($Case.Exit -and $Case.Exit.ContainsKey($A)) { $Case.Exit[$A] } else { 0 }
            if ($A -ceq 'container inspect -f json windows-own') {
              $Case.Seen++
              $Out = & $Case.Inspect $Case.Seen
              if ($null -eq $Out) { $global:LASTEXITCODE = 1 } else { $Out }
            }
            elseif ($A -ceq 'logs windows-own') { if ($Case.Logs) { $Case.Logs } else { $Proof } }
            else { 'wslc output' }
          }
          $S = $SeedArgs -join ' '; $R = $RunArgs -join ' '; $G = $Good -join ' '
          $Head = @($S, 'remove windows-own', 'volume inspect windows-own-home', 'volume inspect windows-own-work', 'volume inspect windows-own-nix', $R)
          $Clear = @('container inspect -f json windows-own', 'stop windows-own', 'remove windows-own', $G)
          # Rollback succeeds only when the old container is then Running on its old image for three consecutive polls.
          $I = 'container inspect -f json windows-own'
          $OldUp = '{"Name":"windows-own","State":{"Running":true},"Config":{"Image":"' + $OldImage + '"}}'
          $OldDown = '{"Name":"windows-own","State":{"Running":false},"Config":{"Image":"' + $OldImage + '"}}'
          $Verified = @($I, $I, $I); $Unverified = @(1..60 | ForEach-Object { $I })
          $Cases = [ordered]@{
            'proven' = @{ Inspect = { $NewUp }; Want = 'ok'; Calls = $Head + @('container inspect -f json windows-own', 'logs windows-own') }
            'seed fails' = @{ Exit = @{ $S = 1 }; Inspect = { $OldUp }; Calls = @($S, 'start windows-own') + $Verified
              Want = 'Replace failed: WSLC seed failed: 1 | rollback succeeded: start old exit 0; old Running on its old image' }
            'remove fails' = @{ Exit = @{ 'remove windows-own' = 1 }; Inspect = { $OldUp }; Calls = @($S, 'remove windows-own', 'start windows-own') + $Verified
              Want = 'Replace failed: WSLC remove failed: 1 | rollback succeeded: start old exit 0; old Running on its old image' }
            'run fails' = @{ Exit = @{ $R = 1 }; Inspect = { param($N) if ($N -eq 1) { $null } else { $OldUp } }; Calls = $Head + @($I, $G) + $Verified
              Want = 'Replace failed: WSLC run failed: 1 | rollback succeeded: recorded argv exit 0; old Running on its old image' }
            'start old exits 0, old not Running' = @{ Exit = @{ $S = 1 }; Inspect = { $OldDown }; Calls = @($S, 'start windows-own') + $Unverified
              Want = 'Replace failed: WSLC seed failed: 1 | rollback FAILED: start old exit 0; old not Running on its old image within 60 s' }
            'old starts then keeps crashing' = @{ Exit = @{ $S = 1 }; Inspect = { param($N) if ($N % 3 -eq 0) { $OldDown } else { $OldUp } }
              Calls = @($S, 'start windows-own') + $Unverified
              Want = 'Replace failed: WSLC seed failed: 1 | rollback FAILED: start old exit 0; old not Running on its old image within 60 s' }
            'recorded argv exits 0, other image Running' = @{ Exit = @{ $R = 1 }; Inspect = { param($N) if ($N -eq 1) { $null } else { $NewUp } }
              Calls = $Head + @($I, $G) + $Unverified
              Want = 'Replace failed: WSLC run failed: 1 | rollback FAILED: recorded argv exit 0; old not Running on its old image within 60 s' }
            'post-gate fails, rollback fails' = @{ Exit = @{ $G = 1 }; Inspect = { $NewUp }; Logs = 'x'
              Calls = $Head + @(1..60 | ForEach-Object { 'container inspect -f json windows-own', 'logs windows-own' }) + $Clear
              Want = "Replace failed: New windows-own did not show Running and '$Proof' within 60 s. | rollback FAILED: stop new exit 0; remove new exit 0; recorded argv exit 1" }
          }
          foreach ($K in $Cases.Keys) {
            $Case = $Cases[$K]; $Calls = [System.Collections.Generic.List[string]]::new()
            $Got = try { Complete-Replace $Good; 'ok' } catch { $_.Exception.Message }
            if ($Got -cne $Case.Want -or ($Calls -join "`n") -cne ($Case.Calls -join "`n")) { "replace '$K' gave: $Got"; $Calls; exit 1 }
            if (@($Calls) -cmatch '^(remove|rm|stop|run) (.* )?(-f|-v|--force|--volumes)( |$)|^volume (remove|rm|prune)') { "replace '$K' used a forbidden flag"; exit 1 }
          }
          $global:LASTEXITCODE = 0
      - name: Build actual own OCI image and the CI-only upgrade image
        run: nix build .#own-image .#own-image-next --no-write-lock-file --print-build-logs
      # The completed own B2 interaction trial is not rerun here; its step text stays in history (own-image.yml at
      # 21b31e1) with its passing runs. This checks own adoption without Xpra: a fresh start, a successful same-image
      # restart and a recreation on the same volumes, each with strict SSH and the three loopback CDP pages.
      - name: Seed, lock, restart and recreation with short SSH/Nix/CDP checks (no real logins)
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          docker load < result
          docker load < result-1
          image=$(docker image inspect ghcr.io/roccho-dev/windows-own:nix --format '{{.Id}}')
          next=$(docker image inspect ghcr.io/roccho-dev/windows-own:next --format '{{.Id}}')
          d="$(mktemp -d)"
          # Every file this step writes under $d; the exit trap removes exactly these, then the empty directory.
          d_files=(after head1 key key.pub known_hosts out key2 key2.pub mig-a mig-b mig-head mig-paths)
          # Removes one of those regular files; a link or other type is kept and fails the step.
          plain() { if [ -L "$1" ] || { [ -e "$1" ] && [ ! -f "$1" ]; }; then echo "kept unexpected entry $1" >&2; return 1; fi; rm -f -- "$1"; }
          trap 'status=$?; [ "$status" -eq 0 ] || docker logs own-smoke 2>&1 | tail -n 40 || true; docker rm -f own-smoke own-hold >/dev/null 2>&1 || true; docker volume rm own-smoke-home own-smoke-work own-smoke-nix own-smoke-empty own-smoke-foreign own-smoke-mig-home own-smoke-mig-work own-smoke-mig-nix >/dev/null 2>&1 || true; for f in "${d_files[@]}"; do plain "$d/$f" || exit 1; done; rmdir -- "$d" || { echo "kept $d: unexpected entries" >&2; exit 1; }' EXIT
          fail() { echo "FAIL $*" >&2; exit 1; }
          ssh-keygen -q -t ed25519 -N '' -f "$d/key"
          for v in home work nix empty foreign; do docker volume create "own-smoke-$v" >/dev/null; done
          nixm() { echo "type=volume,source=$1,target=/nix,volume-nocopy"; }
          ids=(-e OWN_HOME_VOLUME=own-smoke-home -e OWN_WORK_VOLUME=own-smoke-work -e OWN_NIX_VOLUME=own-smoke-nix)
          home=(-v own-smoke-home:/home/dev); work=(-v own-smoke-work:/work/repos); nixv=(--mount "$(nixm own-smoke-nix)")
          seed() { docker run --rm -v "own-smoke-$2:/seed" -e "OWN_NIX_VOLUME=own-smoke-$2" "$1" /bin/own-nix-seed; }
          # Every name, size and mtime under the nix volume: "nothing written" is an exact comparison.
          listing() { docker run --rm -v own-smoke-nix:/n "$image" /bin/bash -c 'cd /n && find . -printf "%p %s %T@\n" | LC_ALL=C sort | sha256sum'; }
          # The seed copies exactly the image's GC-rooted closure, so no store entry's name (after its hash) may name Xpra.
          # The listing is read whole first (a failed read ends the step) and must show the seeded roots; the match then
          # runs on that text, so neither a read failure nor an early-exiting reader can pass for absence.
          no_xpra_store() {
            local names
            names=$(docker run --rm -v own-smoke-nix:/n "$image" /bin/ls /n/store)
            [[ $names == *-own-nix-roots* ]] || fail "the $1 seeded store listing has no own-nix-roots"
            names=$(sed 's/^[0-9a-z]*-//' <<<"$names")
            if [[ ${names,,} == *xpra* ]]; then fail "xpra in the $1 seeded store"; fi
          }
          refuse() {
            local want=$1; shift
            if timeout 60 docker run --rm "$@" "$image" > "$d/out" 2>&1; then fail "started despite: $want"; fi
            grep -qF "$want" "$d/out" || { cat "$d/out" >&2; fail "wrong refusal for: $want"; }
            if grep -qF 'own-mounts ok' "$d/out"; then fail "gate passed despite: $want"; fi
          }

          # An empty /nix hides the image store: nothing can start, and nothing is written.
          if docker run --rm --mount "$(nixm own-smoke-empty)" "$image" > "$d/out" 2>&1; then fail 'started on an empty /nix'; fi
          test -z "$(docker run --rm -v own-smoke-empty:/e "$image" /bin/ls -A /e)" || fail 'an empty /nix was written'

          # Fresh seed: store, DB, profile and GC root; no lock file (the lock is the volume root); a rerun copies 0.
          roots=$(docker run --rm "$image" /bin/readlink /etc/own-nix-roots)
          seed "$image" nix | grep -qE "^own-nix-seed ok volume=own-smoke-nix roots=$roots copied=[1-9][0-9]*$" || fail 'fresh seed'
          no_xpra_store fresh
          test "$(docker run --rm -v own-smoke-nix:/n "$image" /bin/ls -A /n | tr '\n' ' ')" = 'store var ' || fail 'unexpected top-level entries'
          seed "$image" nix | grep -qxF "own-nix-seed ok volume=own-smoke-nix roots=$roots copied=0" || fail 'reseed was not a no-op'
          # An interrupted copy leaves its staging directory: the seed refuses, writes nothing and never deletes it.
          docker run --rm -v own-smoke-nix:/n "$image" /bin/bash -c 'install -d -m 700 /n/.own-seed.interrupt && echo foreign > /n/.own-seed.interrupt/partial'
          before=$(listing)
          if seed "$image" nix > "$d/out" 2>&1; then fail 'seeded over an interrupted staging directory'; fi
          grep -qF '/seed/.own-seed.interrupt is left from an interrupted seed; not deleting it' "$d/out" || fail 'interrupted staging refusal'
          test "$(listing)" = "$before" || fail 'a seed refused for an interrupted staging directory wrote'
          docker run --rm -v own-smoke-nix:/n "$image" /bin/bash -c 'f=/n/.own-seed.interrupt/partial; [ -f $f ] && [ ! -L $f ] && [ "$(cat $f)" = foreign ] && rm -- $f && rmdir -- ${f%/*}'
          seed "$image" nix | grep -qxF "own-nix-seed ok volume=own-smoke-nix roots=$roots copied=0" || fail 'seed after inspecting the staging directory'
          docker run --rm -v own-smoke-foreign:/f "$image" /bin/bash -c 'echo x > /f/x'
          if seed "$image" foreign > "$d/out" 2>&1; then fail 'seeded a foreign volume'; fi
          grep -qF '/seed is neither empty nor an own /nix volume' "$d/out" || fail 'foreign volume refusal'

          # Mount gate before any service.
          refuse 'own-mounts: set OWN_HOME_VOLUME, OWN_WORK_VOLUME and OWN_NIX_VOLUME' "${home[@]}" "${work[@]}" "${nixv[@]}"
          refuse 'own-mounts: /work/repos must be exactly volume own-smoke-work, rw' "${home[@]}" "${nixv[@]}" "${ids[@]}"
          refuse 'own-mounts: /home/dev must be exactly volume own-smoke-home, rw' -v own-smoke-home:/home/dev:ro "${work[@]}" "${nixv[@]}" "${ids[@]}"
          refuse 'own-mounts: /home/dev must be exactly volume own-smoke-home' -v own-smoke-foreign:/home/dev "${work[@]}" "${nixv[@]}" "${ids[@]}"
          refuse 'own-mounts: /nix must be exactly volume own-smoke-nix, rw' "${home[@]}" "${work[@]}" --mount "$(nixm own-smoke-nix),readonly" "${ids[@]}"
          refuse 'own-mounts: exactly three volumes are allowed' "${home[@]}" "${work[@]}" "${nixv[@]}" -v own-smoke-empty:/extra "${ids[@]}"

          # Waits for one more gate line than $1: a restarted container keeps its earlier log.
          gate() {
            for _ in {1..60}; do
              [ "$(docker logs own-smoke 2>&1 | grep -cxF 'own-mounts ok home=own-smoke-home work=own-smoke-work nix=own-smoke-nix')" -gt "$1" ] && return 0
              sleep 1
            done
            fail 'own-start did not pass its gate'
          }
          run() {
            docker run -d --name own-smoke --shm-size 1g -p 127.0.0.1:2223:2223 "${home[@]}" "${work[@]}" "${nixv[@]}" "${ids[@]}" \
              -e OWN_TRIAL_UNSANDBOXED=1 "$@" >/dev/null
            gate 0
          }
          ssh_cmd=(ssh -F /dev/null -p 2223 -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o GlobalKnownHostsFile=/dev/null -o "UserKnownHostsFile=$d/known_hosts" dev@127.0.0.1)
          ssh_ready() { for _ in {1..60}; do "${ssh_cmd[@]}" true 2>/dev/null && return 0; sleep 1; done; fail 'ssh'; }
          # Each headless profile serves its own page on its loopback CDP port, read through strict SSH; no Xpra
          # process runs and none is on the SSH PATH.
          display() {
            local p
            for p in 1 2 3; do
              for _ in {1..60}; do
                "${ssh_cmd[@]}" "curl -fsS --max-time 5 http://127.0.0.1:$((9221 + p))/json/list" 2>/dev/null |
                  jq -e --arg t "own p$p" 'any(.[]; .type == "page" and .title == $t)' >/dev/null && continue 2
                sleep 1
              done
              fail "no CDP page own p$p"
            done
            # The process list is read whole first and must show own-start and sshd; store hashes are dropped before the
            # match (base32 can spell it).
            local procs
            procs=$(docker top own-smoke)
            [[ $procs == *own-start* && $procs == *sshd* ]] || fail 'docker top did not list own-start and sshd'
            procs=$(sed -E 's|/nix/store/[0-9a-z]{32}-|/nix/store/|g' <<<"$procs")
            if [[ ${procs,,} == *xpra* ]]; then fail 'an xpra process runs'; fi
            "${ssh_cmd[@]}" 'if command -v xpra; then exit 1; fi' || fail 'xpra is on the SSH PATH'
          }
          run -e "OWN_AUTHORIZED_KEY=$(cat "$d/key.pub")" "$image"
          # The host key is pinned from the home volume, never accepted anew.
          printf '[127.0.0.1]:2223 %s\n' "$(docker exec own-smoke /bin/cat /home/dev/.ssh/ssh_host_ed25519_key.pub | cut -d' ' -f1,2)" > "$d/known_hosts"
          ssh_ready
          "${ssh_cmd[@]}" 'set -eu
            echo home > ~/own-home-marker
            git init -q /work/repos/p && cd /work/repos/p
            git -c user.name=ci -c user.email=ci@example.invalid commit -q --allow-empty -m first
            git rev-parse HEAD' > "$d/head1"
          display

          # Lock: a seed is refused while own holds the volume, and writes nothing.
          before=$(listing)
          if seed "$image" nix > "$d/out" 2>&1; then fail 'seeded while own runs'; fi
          grep -qF 'own-smoke-nix is in use by a running own container or another seed' "$d/out" || fail 'lock refusal'
          test "$(listing)" = "$before" || fail 'a refused seed wrote'
          docker stop -t 30 own-smoke >/dev/null
          # Any holder of the root lock, here a plain container, stops both a seed and own-start.
          docker run -d --name own-hold -v own-smoke-nix:/n "$image" /bin/bash -c 'exec 9</n; flock -x 9; echo held; exec sleep infinity' >/dev/null
          for _ in {1..30}; do docker logs own-hold 2>&1 | grep -qx held && break; sleep 1; done
          if seed "$image" nix > "$d/out" 2>&1; then fail 'seeded while another container holds the lock'; fi
          grep -qF 'is in use by a running own container or another seed' "$d/out" || fail 'held-lock seed refusal'
          docker start own-smoke >/dev/null
          test "$(docker wait own-smoke)" != 0 || fail 'own started while the lock was held'
          docker logs own-smoke 2>&1 | grep -qF 'own-nix: own-smoke-nix is in use by another own container or a seed' || fail 'held-lock start refusal'
          docker rm -f own-hold >/dev/null

          # Successful restart of the same container and image: the pinned host key, home and work state are kept.
          same=$(docker inspect --format '{{.Id}} {{.Image}}' own-smoke)
          test "${same#* }" = "$image" || fail 'not the first image'
          docker start own-smoke >/dev/null
          gate 1
          test "$(docker inspect --format '{{.Id}} {{.Image}}' own-smoke)" = "$same" || fail 'restart changed the container or image'
          ssh_ready
          "${ssh_cmd[@]}" 'test "$(cat ~/own-home-marker)" = home && cd /work/repos/p && git rev-parse HEAD' > "$d/after"
          test "$(cat "$d/after")" = "$(cat "$d/head1")" || fail 'restart lost home or work state'
          display
          docker stop -t 30 own-smoke >/dev/null

          # Package addition by definition: seed the next image, recreate on the same volumes, short SSH/Nix check.
          seed "$next" nix | grep -qE "^own-nix-seed ok volume=own-smoke-nix roots=.* copied=[1-9][0-9]*$" || fail 'upgrade seed'
          no_xpra_store next
          old_id=$(docker inspect --format '{{.Id}}' own-smoke)
          docker rm own-smoke >/dev/null
          run "$next"
          test "$(docker inspect --format '{{.Id}}' own-smoke)" != "$old_id" || fail 'not a new container'
          ssh_ready
          "${ssh_cmd[@]}" 'set -eu
            test "$(id -un)" = dev
            test "$NIX_REMOTE" = daemon
            hello > /dev/null
            test "$(readlink /nix/var/nix/profiles/own-dev)" = own-dev-2-link
            test "$(codex --version)" = "codex-cli 0.157.1"
            test "$(claude --version)" = "2.1.283 (Claude Code)"
            gh --version | grep -qE "^gh version 2\.96\.0( |$)"
            test "$(cat ~/own-home-marker)" = home && test ! -e /work/repos/own-home-marker
            cd /work/repos/p && git rev-parse HEAD
            git -c user.name=ci -c user.email=ci@example.invalid commit -q --allow-empty -m second
            nix build --impure --out-link /work/repos/p/result --expr "derivation { name = \"own-proof\"; system = \"x86_64-linux\"; builder = \"/bin/sh\"; args = [ \"-c\" \"echo built > \$out\" ]; }"
            test "$(cat /work/repos/p/result)" = built
            if touch /nix/store/dev-write 2>/dev/null; then exit 1; fi' > "$d/after"
          test "$(head -n1 "$d/after")" = "$(cat "$d/head1")" || fail 'work commit lost'
          docker exec own-smoke /bin/nix-store --verify --check-contents
          display
          echo 'PASS own seed, lock, gate, restart and recreation with SSH/Nix/CDP and no Xpra' | tee -a "$GITHUB_STEP_SUMMARY"

          # Legacy migration: the legacy home-only image -> the bound image -> back -> forward again on one synthetic
          # home, in the order hosts/own/win.ps1 Replace and its recorded rollback argv use. It runs only when this change
          # re-pins the binding away from the legacy image; otherwise it reports not applicable and never prints PASS.
          docker stop -t 30 own-smoke >/dev/null
          docker rm own-smoke >/dev/null
          legacy=ghcr.io/roccho-dev/windows-own@sha256:6583bf6e5735ff6c3ebc31bf8d20ab9797511305cf2ffc0452920e65db4ec8dc
          [[ $BASE =~ ^[0-9a-f]{40}$ ]] || fail 'no comparison base for the legacy migration'
          old=$(git show "$BASE:hosts/own/bindings/G6I3.json" | jq -er .image) || fail 'base binding unreadable'
          new=$(jq -er .image hosts/own/bindings/G6I3.json) || fail 'binding unreadable'
          if [ "$old" != "$legacy" ] || [ "$new" = "$old" ]; then
            echo 'own legacy migration: not applicable (the binding is not re-pinned from the legacy image)' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            docker pull -q "$old" >/dev/null
            docker pull -q "$new" >/dev/null
            test "$(docker image inspect "$new" --format '{{.Id}}')" = "$image" || fail 'the bound image is not the image this job built and tested'
            ssh-keygen -q -t ed25519 -N '' -f "$d/key2"
            for v in mig-home mig-work mig-nix; do docker volume create "own-smoke-$v" >/dev/null; done
            mig=(-v own-smoke-mig-home:/home/dev)
            line='own-mounts ok home=own-smoke-mig-home work=own-smoke-mig-work nix=own-smoke-mig-nix'
            # The legacy form as the live host and its rollback argv run it: home only, the key and the trial env.
            old_run() {
              docker run -d --name own-smoke --shm-size 1g -p 127.0.0.1:2223:2223 "${mig[@]}" \
                -e "OWN_AUTHORIZED_KEY=$(cat "$d/key.pub")" -e OWN_TRIAL_UNSANDBOXED=1 "$old" >/dev/null
            }
            # The new form as Replace runs it; a different key in the environment must not replace authorized_keys.
            new_up() {
              docker run -d --name own-smoke --shm-size 1g -p 127.0.0.1:2223:2223 "${mig[@]}" -v own-smoke-mig-work:/work/repos \
                --mount "$(nixm own-smoke-mig-nix)" -e OWN_HOME_VOLUME=own-smoke-mig-home -e OWN_WORK_VOLUME=own-smoke-mig-work \
                -e OWN_NIX_VOLUME=own-smoke-mig-nix -e "OWN_AUTHORIZED_KEY=$(cat "$d/key2.pub")" -e OWN_TRIAL_UNSANDBOXED=1 "$new" >/dev/null
              local _
              for _ in {1..60}; do [ "$(docker logs own-smoke 2>&1 | grep -cxF "$line")" = 1 ] && break; sleep 1; done
              [ "$(docker logs own-smoke 2>&1 | grep -cxF "$line")" = 1 ] || fail 'the new own did not pass its gate'
              ssh_ready
            }
            down() { docker stop -t 30 own-smoke >/dev/null; docker rm own-smoke >/dev/null; }
            # The image's own bash and coreutils, so the legacy image needs nothing it lacks.
            state() { docker exec own-smoke /bin/bash -c 'cd /home/dev && sha256sum .ssh/ssh_host_ed25519_key.pub .ssh/authorized_keys .config/gh/hosts.yml .codex/ci-marker mig-marker && stat -c "%n %a %u:%g %F" .config/gh/hosts.yml .codex/ci-marker'; }
            # The executables actually run: each must resolve (-e, not -f) to an executable store file; its path and
            # content hash are compared, so a tool missing from both images cannot compare equal.
            paths() {
              docker exec own-smoke /bin/bash -c 'set -eu
                for t in chromium codex gh; do
                  r=$(readlink -e "/bin/$t")
                  case $r in /nix/store/*) ;; *) echo "$t is not a store path: $r" >&2; exit 1 ;; esac
                  test -f "$r" && test -x "$r"
                  sha256sum "$r"
                done'
            }
            new_checks() {
              "${ssh_cmd[@]}" 'set -eu
                test -z "${GH_CONFIG_DIR-}"
                test "$(gh config get git_protocol -h github.com)" = ssh
                test "$NIX_REMOTE" = daemon
                test "$(codex --version)" = "codex-cli 0.157.1"
                test "$(claude --version)" = "2.1.283 (Claude Code)"
                test "$(readlink /nix/var/nix/profiles/own-dev)" = own-dev-1-link
                test ! -e /work/repos/.auth
                nix build --impure --no-link --expr "derivation { name = \"own-mig\"; system = \"x86_64-linux\"; builder = \"/bin/sh\"; args = [ \"-c\" \"echo ok > \$out\" ]; }" >/dev/null'
              test "$(state)" = "$(cat "$d/mig-a")" || fail 'home keys or synthetic state changed'
              test "$(paths)" = "$(cat "$d/mig-paths")" || fail 'chromium, codex or gh differ from the legacy image'
            }
            # 1. Legacy: pin its host key from the home volume and write synthetic, credential-free state.
            old_run
            for _ in {1..60}; do docker exec own-smoke /bin/test -s /home/dev/.ssh/ssh_host_ed25519_key.pub && break; sleep 1; done
            printf '[127.0.0.1]:2223 %s\n' "$(docker exec own-smoke /bin/cut -d' ' -f1,2 /home/dev/.ssh/ssh_host_ed25519_key.pub)" > "$d/known_hosts"
            ssh_ready
            "${ssh_cmd[@]}" 'set -eu
              echo mig > ~/mig-marker
              install -d -m 700 ~/.config/gh ~/.codex
              printf "github.com:\n    user: ci\n    git_protocol: ssh\n" > ~/.config/gh/hosts.yml
              chmod 600 ~/.config/gh/hosts.yml
              echo session > ~/.codex/ci-marker'
            state > "$d/mig-a"
            paths > "$d/mig-paths"
            # 2. Forward in Replace's order: stop, seed, remove (never -v), run.
            docker stop -t 30 own-smoke >/dev/null
            out=$(seed "$new" mig-nix)
            [ "$(grep -cE '^own-nix-seed ok volume=own-smoke-mig-nix roots=.* copied=[1-9][0-9]*$' <<<"$out")" = 1 ] || fail 'migration seed'
            docker rm own-smoke >/dev/null
            new_up
            new_checks
            "${ssh_cmd[@]}" 'set -eu
              git init -q /work/repos/mig && cd /work/repos/mig
              git -c user.name=ci -c user.email=ci@example.invalid commit -q --allow-empty -m mig
              git rev-parse HEAD' > "$d/mig-head"
            # 3. Back to the legacy form with the argv the rollback records.
            down
            old_run
            ssh_ready
            test "$(state)" = "$(cat "$d/mig-a")" || fail 'rollback changed home keys or synthetic state'
            test "$(paths)" = "$(cat "$d/mig-paths")" || fail 'rollback changed chromium, codex or gh'
            # 4. Forward again: the reseed copies nothing and the work commit is kept.
            docker stop -t 30 own-smoke >/dev/null
            out=$(seed "$new" mig-nix)
            [ "$(grep -cE '^own-nix-seed ok volume=own-smoke-mig-nix roots=.* copied=0$' <<<"$out")" = 1 ] || fail 'reseed was not a no-op'
            docker rm own-smoke >/dev/null
            new_up
            new_checks
            "${ssh_cmd[@]}" 'cd /work/repos/mig && git rev-parse HEAD' > "$d/mig-b"
            test "$(cat "$d/mig-b")" = "$(cat "$d/mig-head")" || fail 'work commit lost'
            printf 'own legacy migration %s -> %s, image %s\n' "$old" "$new" "$image" >> "$GITHUB_STEP_SUMMARY"
            echo 'PASS own legacy migration: legacy -> bound -> legacy -> bound with unchanged host and authorized keys, synthetic state, tool paths and work' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Keep the tested image for publishing
        if: inputs.publish
        run: cp -L result own-image.tar.gz
      - if: inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: own-image
          path: own-image.tar.gz
          retention-days: 1

  # Only trusted pushes to the listed branches receive package write access.
  publish:
    needs: build-test
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: own-image
      - name: Publish tested image by commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE: ${{ needs.build-test.outputs.source }}
          DRV: ${{ needs.build-test.outputs.drv }}
        run: |
          set -euo pipefail
          test "$SOURCE" = "$GITHUB_SHA"
          docker load < own-image.tar.gz
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          repo=ghcr.io/roccho-dev/windows-own
          image="$repo:sha-${SOURCE}"
          docker tag "$repo:nix" "$image"
          docker push "$image" | tee push.log
          # The one digest this push reported must be the image's one RepoDigest for this repository; otherwise the job
          # fails and records no digest.
          pushed=$(sed -nE 's/^sha-[0-9a-f]{40}: digest: (sha256:[0-9a-f]{64}) size: [0-9]+$/\1/p' push.log)
          [ "$(printf '%s\n' "$pushed" | grep -c .)" = 1 ] || { echo 'RED: push reported no single digest' >&2; exit 1; }
          repo_digests=$(docker image inspect "$image" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep -F "$repo@" || true)
          [ "$repo_digests" = "$repo@$pushed" ] || { echo 'RED: local RepoDigest differs from the pushed digest' >&2; exit 1; }
          printf 'source %s\ndrvPath %s\ndigest %s\n' "$SOURCE" "$DRV" "$repo@$pushed" >> "$GITHUB_STEP_SUMMARY"
