name: own trial image

on:
  workflow_call:
    inputs:
      publish:
        description: Publish the exact tested image
        required: false
        type: boolean
        default: false

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 90
    outputs:
      source: ${{ steps.source.outputs.sha }}
      drv: ${{ steps.source.outputs.drv }}
    steps:
      # Test the exact PR head, not the refs/pull/N/merge commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Record source commit and own-image drvPath
        id: source
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          drv="$(nix eval --raw .#own-image.drvPath --no-write-lock-file)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "drv=$drv" >> "$GITHUB_OUTPUT"
          printf 'source %s\ndrvPath %s\nworkflow blob %s\n' "$sha" "$drv" "$(git rev-parse HEAD:.github/workflows/own-image.yml)" >> "$GITHUB_STEP_SUMMARY"
      - name: Evaluate flake checks
        run: nix flake check --no-write-lock-file --print-build-logs
      - name: Build actual own OCI image
        run: nix build .#own-image --no-write-lock-file --print-build-logs
      - name: Test synthetic trial mode, restart, and volume reuse (no real logins)
        shell: bash
        run: |
          set -euo pipefail
          docker load < result
          key_dir="$(mktemp -d)"
          trap 'kill "${tunnel_pid:-}" 2>/dev/null || true; docker rm -f own-smoke >/dev/null 2>&1 || true; docker volume rm own-smoke-home >/dev/null 2>&1 || true; rm -rf "$key_dir"' EXIT
          ssh-keygen -q -t ed25519 -N '' -f "$key_dir/key"
          docker volume create own-smoke-home
          docker run -d --name own-smoke --shm-size 1g -p 127.0.0.1:2223:2223 \
            -v own-smoke-home:/home/dev \
            -e "OWN_AUTHORIZED_KEY=$(cat "$key_dir/key.pub")" \
            -e OWN_TRIAL_UNSANDBOXED=1 \
            ghcr.io/roccho-dev/windows-own:nix
          ssh_cmd=(ssh -F /dev/null -p 2223 -i "$key_dir/key" -o IdentitiesOnly=yes \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -o "UserKnownHostsFile=$key_dir/known_hosts" dev@127.0.0.1)
          # Three headless profiles: distinct CDP endpoints on 9222-9224, each loopback-only, and only 2223 published.
          browsers() {
            : > "$key_dir/ws"
            for n in 1 2 3; do
              port=$((9221 + n))
              for attempt in {1..60}; do
                if docker exec own-smoke /bin/curl -fsS "http://127.0.0.1:$port/json/list" > "$key_dir/pages$n" 2>/dev/null &&
                  grep -q "own p$n" "$key_dir/pages$n"; then break; fi
                sleep 1
              done
              grep -q "own p$n" "$key_dir/pages$n"
              docker exec own-smoke /bin/curl -fsS "http://127.0.0.1:$port/json/version" > "$key_dir/cdp$n"
              grep -q '"Browser": "Chrome/150\.' "$key_dir/cdp$n"
              grep -o '"webSocketDebuggerUrl": "[^"]*"' "$key_dir/cdp$n" >> "$key_dir/ws"
              "${ssh_cmd[@]}" "test -d /home/dev/chromium/p$n/Default"
            done
            test "$(sort -u "$key_dir/ws" | wc -l)" -eq 3
            docker exec own-smoke /bin/cat /proc/net/tcp /proc/net/tcp6 > "$key_dir/tcp"
            for port in 9222 9223 9224; do
              awk -v h=":$(printf '%04X' "$port")" '$4 == "0A" && substr($2, length($2) - 4) == h { n++; if ($2 !~ /^(0100007F|00000000000000000000000001000000):/) bad++ } END { exit !(n >= 1 && bad == 0) }' "$key_dir/tcp"
            done
            test "$(docker port own-smoke)" = "2223/tcp -> 127.0.0.1:2223"
            "${ssh_cmd[@]}" 'test -x "$(command -v cdp-tty)" && test -x "$(command -v own-view)"'
          }
          for attempt in {1..60}; do
            if "${ssh_cmd[@]}" id -un > "$key_dir/answer" 2>/dev/null; then break; fi
            sleep 1
          done
          test "$(cat "$key_dir/answer")" = dev
          "${ssh_cmd[@]}" 'test "$(command -v codex)" = /bin/codex && test "$(codex --version)" = "codex-cli 0.157.1" && codex app-server --help >/dev/null && codex_bin="$(readlink -f /bin/codex)" && test -x "${codex_bin%/*}/codex-code-mode-host"'
          "${ssh_cmd[@]}" 'gh --version >/dev/null'
          "${ssh_cmd[@]}" 'test -s "$SSL_CERT_FILE" && curl -fsSI https://github.com/ >/dev/null'
          browsers
          ssh -F /dev/null -N -p 2223 -i "$key_dir/key" -o IdentitiesOnly=yes \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$key_dir/known_hosts" \
            -o ExitOnForwardFailure=yes \
            -L 127.0.0.1:14500:127.0.0.1:14500 dev@127.0.0.1 &
          tunnel_pid=$!
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:14500/ > "$key_dir/index" 2>/dev/null; then break; fi
            sleep 1
          done
          grep -Eqi 'xpra|html5' "$key_dir/index"
          python3 - <<'PY'
          import socket
          request = (
              "GET / HTTP/1.1\r\n"
              "Host: 127.0.0.1:14500\r\n"
              "Upgrade: websocket\r\n"
              "Connection: Upgrade\r\n"
              "Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==\r\n"
              "Sec-WebSocket-Version: 13\r\n"
              "Sec-WebSocket-Protocol: binary\r\n"
              "Origin: http://127.0.0.1:14500\r\n\r\n"
          )
          with socket.create_connection(("127.0.0.1", 14500), timeout=5) as conn:
              conn.sendall(request.encode())
              response = conn.recv(4096)
          assert response.startswith(b"HTTP/1.1 101 "), response[:300]
          PY
          kill "$tunnel_pid"
          wait "$tunnel_pid" || true
          unset tunnel_pid
          docker restart own-smoke
          browsers
          old_id="$(docker inspect --format '{{.Id}}' own-smoke)"
          docker rm -f own-smoke
          docker run -d --name own-smoke --shm-size 1g -p 127.0.0.1:2223:2223 \
            -v own-smoke-home:/home/dev \
            -e "OWN_AUTHORIZED_KEY=$(cat "$key_dir/key.pub")" \
            -e OWN_TRIAL_UNSANDBOXED=1 \
            ghcr.io/roccho-dev/windows-own:nix
          test "$(docker inspect --format '{{.Id}}' own-smoke)" != "$old_id"
          browsers
      - name: Keep the tested image for publishing
        if: inputs.publish
        run: cp -L result own-image.tar.gz
      - if: inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: own-image
          path: own-image.tar.gz
          retention-days: 1

  # Only trusted pushes to the listed branches receive package write access.
  publish:
    needs: build-test
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: own-image
      - name: Publish tested image by commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE: ${{ needs.build-test.outputs.source }}
          DRV: ${{ needs.build-test.outputs.drv }}
        run: |
          set -euo pipefail
          test "$SOURCE" = "$GITHUB_SHA"
          docker load < own-image.tar.gz
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/roccho-dev/windows-own:sha-${SOURCE}"
          docker tag ghcr.io/roccho-dev/windows-own:nix "$image"
          docker push "$image"
          printf 'source %s\ndrvPath %s\ndigest %s\n' "$SOURCE" "$DRV" "$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')" >> "$GITHUB_STEP_SUMMARY"
