name: signed release-watch source materialization

on:
  pull_request:
    branches: [proposals]

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'proposal/cli-release-watch-20261009'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Materialize exact accepted source blobs without moving a ref
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python - <<'PY'
          import base64, gzip, json, os, pathlib, re, urllib.request

          repository = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          pr_number = os.environ['PR_NUMBER']
          allowed = {
              'infra/release-watch/watch.mjs': 3,
              'infra/release-watch/watch.test.mjs': 2,
              'hosts/profile/releases.json': 1,
              'hosts/profile/nix.nix': 1,
              'hosts/own/codex.nix': 1,
              '.github/workflows/release-watch.yml': 1,
          }
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          comments = []
          for page in range(1, 100):
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repository}/issues/{pr_number}/comments?per_page=100&page={page}',
                  headers=headers,
              )
              with urllib.request.urlopen(request) as response:
                  batch = json.load(response)
              comments.extend(batch)
              if len(batch) < 100:
                  break
          else:
              raise SystemExit('comment pagination did not terminate')

          pattern = re.compile(r'^<!-- source-payload:(.+):(\d+)/(\d+) -->\n([A-Za-z0-9+/=]+)\s*$')
          chunks = {}
          for comment in comments:
              match = pattern.match(comment.get('body') or '')
              if not match:
                  continue
              path, index, total, payload = match.group(1), int(match.group(2)), int(match.group(3)), match.group(4)
              if path not in allowed:
                  raise SystemExit(f'unexpected payload path: {path}')
              if total != allowed[path] or index < 1 or index > total:
                  raise SystemExit(f'invalid payload index: {path} {index}/{total}')
              key = (path, index)
              if key in chunks:
                  raise SystemExit(f'duplicate payload chunk: {path} {index}')
              chunks[key] = payload

          missing = [(path, index) for path, total in allowed.items() for index in range(1, total + 1) if (path, index) not in chunks]
          if missing:
              raise SystemExit(f'missing payload chunks: {missing}')

          root = pathlib.Path('.')
          for path, total in allowed.items():
              encoded = ''.join(chunks[(path, index)] for index in range(1, total + 1))
              try:
                  content = gzip.decompress(base64.b64decode(encoded, validate=True))
              except Exception as error:
                  raise SystemExit(f'{path}: payload decode failed: {error}')
              target = root / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(content)
              body = json.dumps({'content': base64.b64encode(content).decode(), 'encoding': 'base64'}).encode()
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repository}/git/blobs',
                  data=body,
                  method='POST',
                  headers={**headers, 'Content-Type': 'application/json'},
              )
              with urllib.request.urlopen(request) as response:
                  sha = json.load(response)['sha']
              print(f'FINAL_BLOB {path} {sha}')
          PY
          node --check infra/release-watch/watch.mjs
          node --test infra/release-watch/watch.test.mjs
          test "$(node infra/release-watch/watch.mjs validate hosts/profile/releases.json)" = '{"claude":"2.1.283","codex":"0.157.1"}'
          git diff --check
