name: release watch V2 remaining RESUME0

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type V2-CODEX-REMAINING-RESUME0
        required: true
        type: string
      source_sha:
        description: Exact accepted canonical S3
        required: true
        type: string
      source_tree:
        description: Exact tree of source_sha
        required: true
        type: string
      h1_sha:
        description: Exact accepted C1 CREATE head
        required: true
        type: string
      h2_sha:
        description: Exact accepted C2 ADVANCE head
        required: true
        type: string
      pr_number:
        description: Exact existing bot PR number
        required: true
        type: string
      generation_branch:
        description: Exact existing generation branch
        required: true
        type: string
      window_start_epoch:
        description: Inclusive UTC epoch
        required: true
        type: string
      window_end_epoch:
        description: Exclusive UTC epoch; no more than one hour after start
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-watch-refs/heads/proposals
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  SOURCE_TREE: ${{ inputs.source_tree }}
  H1_SHA: ${{ inputs.h1_sha }}
  H2_SHA: ${{ inputs.h2_sha }}
  PR_NUMBER: ${{ inputs.pr_number }}
  GENERATION_BRANCH: ${{ inputs.generation_branch }}
  WINDOW_START_EPOCH: ${{ inputs.window_start_epoch }}
  WINDOW_END_EPOCH: ${{ inputs.window_end_epoch }}
  TRANSPORT_BRANCH: proposal/cli-release-watch-20261009
  BASE_BRANCH: proposals

jobs:
  codex-v2-remaining-resume0:
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/proposal/cli-release-watch-20261009'
      && github.run_attempt == 1
      && inputs.confirm == 'V2-CODEX-REMAINING-RESUME0'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact remaining-step inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = "refs/heads/$TRANSPORT_BRANCH"
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "${{ inputs.confirm }}" = V2-CODEX-REMAINING-RESUME0
          test "$SOURCE_SHA" = b9fb06934ecd301bdd3480dfbe3e1493e6cc0a27
          test "$SOURCE_TREE" = 2a4225b97439f41a14dfcb85423dc00cdf01fff6
          test "$H1_SHA" = 1f4d227d9602c453711afd2fe3af8b01d6948832
          test "$H2_SHA" = 8ad4d81eb76df0d1a8546e15314a39f714e9c29e
          test "$PR_NUMBER" = 80
          test "$GENERATION_BRANCH" = bot/cli-release-codex-gb9fb06934ecd301bdd3480dfbe3e1493e6cc0a27-v0.161.0-h04d8ab9dbcb9df0edf3c67dca5072a374babfdf762a9bc4ae649ae140b8e2cf0
          [[ $WINDOW_START_EPOCH =~ ^[0-9]{10}$ ]]
          [[ $WINDOW_END_EPOCH =~ ^[0-9]{10}$ ]]
          test "$WINDOW_START_EPOCH" -lt "$WINDOW_END_EPOCH"
          test $((WINDOW_END_EPOCH - WINDOW_START_EPOCH)) -le 3600
          now=$(date -u +%s)
          test "$now" -ge "$WINDOW_START_EPOCH"
          test "$now" -lt "$WINDOW_END_EPOCH"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"

      - name: Prove only the remaining RESUME0 step
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { appendFile, readFile } from 'node:fs/promises';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';

          const core = await import(pathToFileURL(path.resolve('infra/release-watch/watch.mjs')).href);
          const { bindCanonicalInput, githubClient, listAll, maintainOne, prMarker } = core;

          const required = (name) => {
            const value = process.env[name];
            if (!value) throw new Error(`missing ${name}`);
            return value;
          };

          const REPOSITORY = required('GITHUB_REPOSITORY');
          const TOKEN = required('GITHUB_TOKEN');
          const TRANSPORT_SHA = required('GITHUB_SHA');
          const SOURCE_SHA = required('SOURCE_SHA');
          const SOURCE_TREE = required('SOURCE_TREE');
          const H1_SHA = required('H1_SHA');
          const H2_SHA = required('H2_SHA');
          const PR_NUMBER = Number(required('PR_NUMBER'));
          const GENERATION_BRANCH = required('GENERATION_BRANCH');
          const BASE_BRANCH = required('BASE_BRANCH');
          const TRANSPORT_BRANCH = required('TRANSPORT_BRANCH');
          const REGISTRY_PATH = 'hosts/profile/releases.json';
          const BOT = 'github-actions[bot]';
          const T3_SHA = '9b213f12536df4e1f75f42f9a988ea5e2c7ba912';
          const C1 = Object.freeze({
            version: '0.161.0',
            contentHash: '04d8ab9dbcb9df0edf3c67dca5072a374babfdf762a9bc4ae649ae140b8e2cf0',
          });
          const C2 = Object.freeze({
            version: '0.162.1',
            contentHash: 'a676f5722aae0d86cbe3764332f08eab1fdd89dc0a300b3ad4ffbf48611fa3e3',
            proof: true,
            sourceUrl: 'https://github.com/openai/codex/releases/download/rust-v0.162.1/codex-package-x86_64-unknown-linux-musl.tar.gz',
          });
          const PRIOR = Object.freeze({
            run: 38144670377,
            job: 114485415948,
            rVerdict: 'https://github.com/roccho-dev/windows/pull/80#issuecomment-6109794155',
            mutationTotals: Object.freeze({
              total: 8, blob: 1, tree: 2, commit: 2,
              refCreate: 1, refUpdate: 1, prCreate: 1,
              delete: 0, other: 0,
            }),
          });
          const MUTATION_METHODS = new Set(['POST', 'PATCH', 'PUT', 'DELETE']);

          assert.equal(SOURCE_SHA, 'b9fb06934ecd301bdd3480dfbe3e1493e6cc0a27');
          assert.equal(SOURCE_TREE, '2a4225b97439f41a14dfcb85423dc00cdf01fff6');
          assert.equal(H1_SHA, '1f4d227d9602c453711afd2fe3af8b01d6948832');
          assert.equal(H2_SHA, '8ad4d81eb76df0d1a8546e15314a39f714e9c29e');
          assert.equal(PR_NUMBER, 80);
          assert.equal(GENERATION_BRANCH, 'bot/cli-release-codex-gb9fb06934ecd301bdd3480dfbe3e1493e6cc0a27-v0.161.0-h04d8ab9dbcb9df0edf3c67dca5072a374babfdf762a9bc4ae649ae140b8e2cf0');

          function assertWindow() {
            const start = Number(required('WINDOW_START_EPOCH'));
            const end = Number(required('WINDOW_END_EPOCH'));
            const now = Math.floor(Date.now() / 1000);
            assert.ok(Number.isSafeInteger(start) && Number.isSafeInteger(end));
            assert.ok(start < end && end - start <= 3600, 'finite window differs');
            assert.ok(now >= start && now < end, 'finite window is closed');
            return { startEpoch: start, endEpochExclusive: end };
          }

          function publicReceipt(value, apiPath) {
            if (value === null || value === undefined) return null;
            if (Array.isArray(value)) {
              return {
                count: value.length,
                items: value.slice(0, 100).map((item) => ({
                  number: item?.number ?? null,
                  sha: item?.sha ?? null,
                  filename: item?.filename ?? null,
                  author: item?.author?.login ?? null,
                  committer: item?.committer?.login ?? null,
                  base: item?.base ? { ref: item.base.ref ?? null, sha: item.base.sha ?? null } : null,
                  head: item?.head ? {
                    ref: item.head.ref ?? null,
                    sha: item.head.sha ?? null,
                    repo: item.head.repo?.full_name ?? null,
                  } : null,
                })),
              };
            }
            if (apiPath.startsWith('/contents/')) {
              return {
                path: value.path ?? REGISTRY_PATH,
                sha: value.sha ?? null,
                encoding: value.encoding ?? null,
                size: value.size ?? null,
              };
            }
            if (value.object?.sha) return { ref: value.ref ?? null, sha: value.object.sha };
            if (value.merge_base_commit?.sha) {
              return {
                status: value.status ?? null,
                aheadBy: value.ahead_by ?? null,
                behindBy: value.behind_by ?? null,
                totalCommits: value.total_commits ?? null,
                mergeBase: value.merge_base_commit.sha,
              };
            }
            if (value.number) {
              return {
                number: value.number,
                state: value.state ?? null,
                draft: value.draft ?? null,
                user: value.user?.login ?? null,
                base: { ref: value.base?.ref ?? null, sha: value.base?.sha ?? null },
                head: {
                  ref: value.head?.ref ?? null,
                  sha: value.head?.sha ?? null,
                  repo: value.head?.repo?.full_name ?? null,
                },
                marker: String(value.body ?? '').includes(prMarker('codex')),
              };
            }
            if (value.sha) {
              return {
                sha: value.sha,
                tree: value.tree?.sha ?? value.commit?.tree?.sha ?? null,
                parents: (value.parents ?? []).map((parent) => parent.sha),
                author: value.author?.login ?? value.author?.name ?? null,
                committer: value.committer?.login ?? value.committer?.name ?? null,
                authorDate: value.commit?.author?.date ?? value.author?.date ?? null,
                committerDate: value.commit?.committer?.date ?? value.committer?.date ?? null,
                message: value.message ?? value.commit?.message ?? null,
              };
            }
            return { kind: typeof value };
          }

          const rawApi = githubClient(REPOSITORY, TOKEN);
          const apiRecorder = [];
          let sequence = 0;
          const api = async (method, apiPath, body) => {
            const mutationRequested = MUTATION_METHODS.has(method);
            const record = {
              sequence: ++sequence,
              method,
              path: apiPath,
              mutationRequested,
              sent: false,
            };
            if (mutationRequested) {
              record.blocked = true;
              record.error = `read-only remaining RESUME0 transport rejects ${method} ${apiPath}`;
              apiRecorder.push(record);
              throw new Error(record.error);
            }
            try {
              const result = await rawApi(method, apiPath, body);
              record.sent = true;
              record.receipt = publicReceipt(result, apiPath);
              apiRecorder.push(record);
              return result;
            } catch (error) {
              record.sent = true;
              record.error = String(error?.message ?? error).slice(0, 500);
              apiRecorder.push(record);
              throw error;
            }
          };

          const mutationCounts = () => ({
            requested: apiRecorder.filter((item) => item.mutationRequested).length,
            sent: apiRecorder.filter((item) => item.mutationRequested && item.sent).length,
            post: apiRecorder.filter((item) => item.method === 'POST' && item.sent).length,
            patch: apiRecorder.filter((item) => item.method === 'PATCH' && item.sent).length,
            put: apiRecorder.filter((item) => item.method === 'PUT' && item.sent).length,
            delete: apiRecorder.filter((item) => item.method === 'DELETE' && item.sent).length,
          });

          const registryAt = async (ref) => {
            const file = await api('GET', `/contents/${REGISTRY_PATH}?ref=${encodeURIComponent(ref)}`);
            assert.equal(file?.encoding, 'base64');
            return JSON.parse(Buffer.from(file.content, 'base64').toString('utf8'));
          };

          const actorPair = async (sha, label) => {
            const associated = await api('GET', `/commits/${sha}`);
            assert.equal(associated.author?.login, BOT, `${label}: author`);
            assert.equal(associated.committer?.login, BOT, `${label}: committer`);
            return { author: associated.author.login, committer: associated.committer.login };
          };

          const assertRegistry = (source, candidate, expectedPin, label) => {
            assert.deepEqual(candidate.codex.contract, source.codex.contract, `${label}: codex contract`);
            assert.deepEqual(candidate.claude, source.claude, `${label}: Claude must be unchanged`);
            const expected = structuredClone(source);
            expected.codex.pin = structuredClone(expectedPin);
            assert.deepEqual(candidate, expected, `${label}: only codex pin may differ`);
          };

          const evidence = { checks: [], directBefore: null, resume: null, directAfter: null };
          const pass = (name) => evidence.checks.push(name);
          let terminalSuccess = false;
          let terminalFailure = null;
          let maintainOneCalls = 0;
          let finalReceipt;

          try {
            const window = assertWindow();
            pass('finite-window-open');

            const transportRef = await api('GET', `/git/ref/heads/${encodeURIComponent(TRANSPORT_BRANCH)}`);
            assert.equal(transportRef?.object?.sha, TRANSPORT_SHA);
            const transportCommit = await api('GET', `/git/commits/${TRANSPORT_SHA}`);
            assert.deepEqual((transportCommit.parents ?? []).map((item) => item.sha), [T3_SHA]);
            const transportCompare = await api('GET', `/compare/${encodeURIComponent(T3_SHA)}...${encodeURIComponent(TRANSPORT_SHA)}`);
            assert.equal(transportCompare.merge_base_commit?.sha, T3_SHA);
            assert.equal(transportCompare.ahead_by, 1);
            assert.deepEqual((transportCompare.files ?? []).map((file) => file.filename), ['.github/workflows/release-watch.yml']);
            pass('one-path-normal-ff-from-T3');

            const canonicalCommit = await api('GET', `/git/commits/${SOURCE_SHA}`);
            assert.equal(canonicalCommit.tree?.sha, SOURCE_TREE);
            const localRegistry = JSON.parse(await readFile(REGISTRY_PATH, 'utf8'));
            const canonical = await bindCanonicalInput({
              api, baseBranch: BASE_BRANCH, checkoutSha: SOURCE_SHA, localRegistry,
            });
            assert.equal(canonical.baseSha, SOURCE_SHA);
            pass('canonical-S3-bound');

            const h1Raw = await api('GET', `/git/commits/${H1_SHA}`);
            const h2Raw = await api('GET', `/git/commits/${H2_SHA}`);
            assert.deepEqual((h1Raw.parents ?? []).map((item) => item.sha), [SOURCE_SHA]);
            assert.deepEqual((h2Raw.parents ?? []).map((item) => item.sha), [H1_SHA]);
            const h1Actors = await actorPair(H1_SHA, 'H1');
            const h2Actors = await actorPair(H2_SHA, 'H2');
            const ff = await api('GET', `/compare/${encodeURIComponent(H1_SHA)}...${encodeURIComponent(H2_SHA)}`);
            assert.equal(ff.merge_base_commit?.sha, H1_SHA);
            assert.equal(ff.ahead_by, 1);
            pass('H1-H2-normal-FF-and-bot-actors');

            const branchRef = await api('GET', `/git/ref/heads/${encodeURIComponent(GENERATION_BRANCH)}`);
            assert.equal(branchRef?.object?.sha, H2_SHA);
            const pr = await api('GET', `/pulls/${PR_NUMBER}`);
            assert.equal(pr.number, PR_NUMBER);
            assert.equal(pr.state, 'open');
            assert.equal(pr.user?.login, BOT);
            assert.equal(pr.draft, true);
            assert.equal(pr.base?.ref, BASE_BRANCH);
            assert.equal(pr.base?.sha, SOURCE_SHA);
            assert.equal(pr.head?.ref, GENERATION_BRANCH);
            assert.equal(pr.head?.sha, H2_SHA);
            assert.equal(pr.head?.repo?.full_name, REPOSITORY);
            assert.ok(String(pr.body ?? '').includes(prMarker('codex')));
            pass('PR80-and-generation-ref-exact-H2');

            const commits = await listAll(api, `/pulls/${PR_NUMBER}/commits`, { maxPages: 3, maxItems: 250 });
            assert.deepEqual(commits.map((item) => item.sha), [H1_SHA, H2_SHA]);
            for (const commit of commits) {
              assert.equal(commit.author?.login, BOT);
              assert.equal(commit.committer?.login, BOT);
            }
            const files = await listAll(api, `/pulls/${PR_NUMBER}/files`, { maxPages: 30, maxItems: 3000 });
            assert.deepEqual(files.map((file) => file.filename), [REGISTRY_PATH]);
            pass('PR80-history-and-one-registry-path');

            const sourceRegistry = canonical.registry;
            const h1Registry = await registryAt(H1_SHA);
            const h2Registry = await registryAt(H2_SHA);
            assertRegistry(sourceRegistry, h1Registry, C1, 'H1 registry');
            assertRegistry(sourceRegistry, h2Registry, { version: C2.version, contentHash: C2.contentHash }, 'H2 registry');
            pass('C1-C2-pins-and-Claude-unchanged');

            const sourceToH1 = await api('GET', `/compare/${encodeURIComponent(SOURCE_SHA)}...${encodeURIComponent(H1_SHA)}`);
            const sourceToH2 = await api('GET', `/compare/${encodeURIComponent(SOURCE_SHA)}...${encodeURIComponent(H2_SHA)}`);
            assert.equal(sourceToH1.merge_base_commit?.sha, SOURCE_SHA);
            assert.equal(sourceToH2.merge_base_commit?.sha, SOURCE_SHA);
            pass('source-ancestry-exact');

            evidence.directBefore = {
              transport: { sha: TRANSPORT_SHA, parent: T3_SHA, tree: transportCommit.tree?.sha ?? null },
              source: { sha: SOURCE_SHA, tree: SOURCE_TREE },
              h1: { sha: H1_SHA, parents: [SOURCE_SHA], actors: h1Actors, pin: h1Registry.codex.pin },
              h2: { sha: H2_SHA, parents: [H1_SHA], actors: h2Actors, pin: h2Registry.codex.pin },
              pr: { number: PR_NUMBER, draft: pr.draft, base: pr.base.sha, branch: pr.head.ref, head: pr.head.sha },
              window,
            };

            assertWindow();
            const resumeStart = apiRecorder.length;
            maintainOneCalls += 1;
            const resume = await maintainOne({
              repository: REPOSITORY,
              token: TOKEN,
              baseBranch: BASE_BRANCH,
              baseSha: SOURCE_SHA,
              registry: sourceRegistry,
              name: 'codex',
              candidate: C2,
              api,
              objectReceipts: [],
            });
            const resumeApi = apiRecorder.slice(resumeStart);
            assert.equal(maintainOneCalls, 1);
            assert.equal(resume.decision?.action, 'RESUME');
            assert.equal(resume.effects, 0);
            assert.equal(resume.pr, 'https://github.com/roccho-dev/windows/pull/80');
            assert.deepEqual(mutationCounts(), { requested: 0, sent: 0, post: 0, patch: 0, put: 0, delete: 0 });
            assert.equal(resumeApi.some((item) => item.mutationRequested), false);
            pass('production-maintainOne-once-RESUME-effects0-mutations0');

            const afterRef = await api('GET', `/git/ref/heads/${encodeURIComponent(GENERATION_BRANCH)}`);
            const afterPr = await api('GET', `/pulls/${PR_NUMBER}`);
            const afterRegistry = await registryAt(H2_SHA);
            assert.equal(afterRef?.object?.sha, H2_SHA);
            assert.equal(afterPr.head?.sha, H2_SHA);
            assert.equal(afterPr.draft, true);
            assertRegistry(sourceRegistry, afterRegistry, { version: C2.version, contentHash: C2.contentHash }, 'post-RESUME H2 registry');
            assertWindow();
            pass('post-RESUME-direct-readback-unchanged');

            evidence.resume = {
              maintainOneCalls,
              result: resume,
              mutationCounts: mutationCounts(),
              apiRecords: resumeApi,
            };
            evidence.directAfter = {
              refHead: afterRef.object.sha,
              prHead: afterPr.head.sha,
              draft: afterPr.draft,
              pin: afterRegistry.codex.pin,
            };
            terminalSuccess = true;
          } catch (error) {
            terminalFailure = {
              name: error?.name ?? 'Error',
              code: error?.code ?? null,
              message: String(error?.message ?? error).slice(0, 1000),
            };
          } finally {
            finalReceipt = {
              schema: 'windows-cli-release-v2-remaining-resume0.v1',
              success: terminalSuccess,
              failure: terminalFailure,
              runUrl: `${process.env.GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              authority: {
                version: 'windows-cli-release-completion-20261011-v6',
                rVerdict: PRIOR.rVerdict,
              },
              priorActual: {
                run: PRIOR.run,
                job: PRIOR.job,
                source: SOURCE_SHA,
                h1: H1_SHA,
                h2: H2_SHA,
                pr: PR_NUMBER,
                generationBranch: GENERATION_BRANCH,
                mutationTotals: PRIOR.mutationTotals,
                create: 'ACTUAL_PASS',
                advance: 'ACTUAL_PASS',
                failureCause: 'ASYNC_PR_PROJECTION_CONFIRMED',
              },
              remaining: evidence,
              mutationCounts: mutationCounts(),
              apiRecorder,
              composition: {
                tuple: { source: SOURCE_SHA, h1: H1_SHA, h2: H2_SHA, pr: PR_NUMBER, generationBranch: GENERATION_BRANCH },
                priorReceiptComment: 'https://github.com/roccho-dev/windows/pull/79#issuecomment-6109753080',
                instruction: 'Combine the intact prior machine receipt with this remaining RESUME0 receipt; do not reconstruct or replay CREATE/ADVANCE.',
              },
            };
            const json = JSON.stringify(finalReceipt, null, 2);
            const summary = [
              '# V2 remaining RESUME0 — read-only actual cover',
              '',
              `- success: ${terminalSuccess}`,
              `- S3: \`${SOURCE_SHA}\` / tree \`${SOURCE_TREE}\``,
              `- H1: \`${H1_SHA}\``,
              `- H2: \`${H2_SHA}\``,
              `- PR: #${PR_NUMBER}`,
              `- maintainOne calls: ${maintainOneCalls}`,
              `- mutation counts: \`${JSON.stringify(mutationCounts())}\``,
              '',
              '<details><summary>Intact remaining-step machine receipt</summary>',
              '',
              '```json',
              json,
              '```',
              '</details>',
              '',
            ].join('\n');
            await appendFile(process.env.GITHUB_STEP_SUMMARY, summary);
            console.log(`V2_REMAINING_RESUME0_RECEIPT ${JSON.stringify(finalReceipt)}`);
          }

          if (!terminalSuccess) {
            const error = new Error(terminalFailure?.message ?? 'remaining RESUME0 failed');
            error.code = terminalFailure?.code ?? 'V2_REMAINING_RESUME0_FAILED';
            throw error;
          }
          NODE
