name: release watch

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-watch
  cancel-in-progress: false

jobs:
  propose:
    if: github.ref == 'refs/heads/proposals'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - name: Verify pure contract and canonical versions
        run: |
          set -euo pipefail
          node --test infra/release-watch/watch.test.mjs
          watcher=$(node infra/release-watch/watch.mjs validate hosts/profile/releases.json)
          nix_versions=$(nix eval --json .#releaseVersions --no-write-lock-file)
          test "$watcher" = "$nix_versions"
          printf 'source %s\nreleaseVersions %s\n' "$(git rev-parse HEAD)" "$nix_versions" >> "$GITHUB_STEP_SUMMARY"
      - name: Resolve official stable releases and maintain one draft PR per CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node infra/release-watch/watch.mjs propose hosts/profile/releases.json | tee -a "$GITHUB_STEP_SUMMARY"
