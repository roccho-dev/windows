            `- run: ${runUrl}`,
            `- transport: \`${TRANSPORT_SHA}\` on \`${process.env.GITHUB_REF}\``,
            `- canonical S: \`${SOURCE_SHA}\` / tree \`${SOURCE_TREE}\``,
            `- C1: \`${c1Candidate.version}\` / \`${c1Candidate.contentHash}\``,
