name: verified candidate schema materialization

on:
  pull_request:
    branches: [proposals]

permissions:
  contents: write

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'proposal/cli-release-watch-20261009'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Patch exact candidate contract and materialize blobs only
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python - <<'PY'
          import base64, json, os, pathlib, urllib.request

          root = pathlib.Path('.')
          watch = root / 'infra/release-watch/watch.mjs'
          text = watch.read_text()
          old = "  exactKeys(candidate, ['contentHash', 'proof', 'version'], 'candidate');"
          new = """  if (!candidate || typeof candidate !== 'object' || Array.isArray(candidate)) fail('candidate must be an object');
          const allowedCandidateKeys = new Set(['contentHash', 'proof', 'proofReceipt', 'selectedBytes', 'sourceUrl', 'version']);
          const unexpectedCandidateKeys = Object.keys(candidate).filter((key) => !allowedCandidateKeys.has(key));
          if (unexpectedCandidateKeys.length !== 0) fail(`candidate has unexpected keys: ${unexpectedCandidateKeys.sort().join(',')}`);
          for (const key of ['contentHash', 'proof', 'version']) {
            if (!Object.hasOwn(candidate, key)) fail(`candidate missing required key: ${key}`);
          }"""
          if text.count(old) != 1:
              raise SystemExit(f'watch.mjs: expected one old candidate contract, found {text.count(old)}')
          watch.write_text(text.replace(old, new))

          tests = root / 'infra/release-watch/watch.test.mjs'
          text = tests.read_text()
          anchor = """test('V1 A/B/C monotonicity never reverses and equal-version hash drift is RED', () => {"""
          addition = """test('V1 proven resolver evidence is admitted without weakening required candidate fields', () => {
            const full = {
              ...candidate('1.2.4', hex('d')),
              sourceUrl: 'https://example.invalid/tool.tar.gz',
              selectedBytes: 123,
              proofReceipt: { kind: 'sigstore-bundle', identity: 'issuer-bound' },
            };
            assert.equal(decideCandidate(definition(), full).state, 'UPDATE');
            assert.throws(() => decideCandidate(definition(), { ...full, arbitrary: true }), /unexpected keys/);
            assert.throws(() => decideCandidate(definition(), { proof: true, version: '1.2.4' }), /missing required key: contentHash/);
          });

          """
          if text.count(anchor) != 1 or addition in text:
              raise SystemExit('watch.test.mjs: candidate evidence insertion precondition failed')
          tests.write_text(text.replace(anchor, addition + anchor))

          token = os.environ['GH_TOKEN']
          repository = os.environ['REPOSITORY']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'Content-Type': 'application/json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          for path in ('infra/release-watch/watch.mjs', 'infra/release-watch/watch.test.mjs'):
              content = (root / path).read_bytes()
              payload = json.dumps({'content': base64.b64encode(content).decode(), 'encoding': 'base64'}).encode()
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repository}/git/blobs',
                  data=payload,
                  method='POST',
                  headers=headers,
              )
              with urllib.request.urlopen(request) as response:
                  sha = json.load(response)['sha']
              print(f'CORRECTION_BLOB {path} {sha}')
          PY
          node --check infra/release-watch/watch.mjs
          node --test infra/release-watch/watch.test.mjs
          test "$(node infra/release-watch/watch.mjs validate hosts/profile/releases.json)" = '{"claude":"2.1.283","codex":"0.157.1"}'
          git diff --check
