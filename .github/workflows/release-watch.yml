name: release watch source materialize

on:
  pull_request:
    branches: [proposals]
    paths:
      - .github/workflows/release-watch.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: release-watch-source-materialize
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'proposal/cli-release-watch-20261009'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPECTED_PARENT: 44fa0e7f9d1e26a29b4f26cfeac45f022dcbd106
      EXPECTED_WATCH_BLOB: c9b8a3c6472e2f4d6b51426d4a6c25ea9d9d74ed
      EXPECTED_TEST_BLOB: 175038e82fd454632f1b86a88fc2b11bf869c4c4
      BRANCH: proposal/cli-release-watch-20261009
      WATCH_CHUNKS: >-
        2f4792f32b7257fb5474122b8617d06a2a7d31b5
        7bca9faec94c63f4a4eab5a623dd1fc930aecd72
        a31c12725ad9f5c9f68f316bf8d232b62f1b0675
        5825910bb56bf603b76e73c77aa39fa00df8e206
        97984b22ff780a283718fa77228aab17b04454db
        d4e3b5d4490d86d5704e999d2bd14092de97c213
      TEST_CHUNKS: >-
        f9edcf3f119abd5b6bfd09acf4410f9d1f9ba735
        41a4a996b6cc0a51461f07dda1c92b960a261727
        cd3473a18583e23c079bec4edcf73926ade4a02a
        1d05689dc05c79be30f29736bb9d55e98a73c152
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - name: Materialize exact current-head source correction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(git rev-parse HEAD)
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          remote=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          test "$remote" = "$current"

          fetch_chunk() {
            python - "$1" <<'PY'
          import base64, json, os, sys, urllib.request
          sha = sys.argv[1]
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs/{sha}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(req) as response:
              data = json.load(response)
          sys.stdout.buffer.write(base64.b64decode(data["content"]))
          PY
          }

          : > /tmp/watch.b64
          for sha in $WATCH_CHUNKS; do fetch_chunk "$sha" >> /tmp/watch.b64; done
          base64 -d /tmp/watch.b64 > infra/release-watch/watch.mjs
          : > /tmp/test.b64
          for sha in $TEST_CHUNKS; do fetch_chunk "$sha" >> /tmp/test.b64; done
          base64 -d /tmp/test.b64 > infra/release-watch/watch.test.mjs

          test "$(git hash-object infra/release-watch/watch.mjs)" = "$EXPECTED_WATCH_BLOB"
          test "$(git hash-object infra/release-watch/watch.test.mjs)" = "$EXPECTED_TEST_BLOB"
          git show "$EXPECTED_PARENT:.github/workflows/release-watch.yml" > .github/workflows/release-watch.yml

          node --check infra/release-watch/watch.mjs
          node --test infra/release-watch/watch.test.mjs
          nix build .#checks.x86_64-linux.release-watch --no-write-lock-file --print-build-logs

          tools=$(nix build --impure --no-link --print-out-paths --expr '
            let
              flake = builtins.getFlake (toString ./.);
              pkgs = flake.inputs.nixpkgs.legacyPackages.x86_64-linux;
            in pkgs.buildEnv {
              name = "release-proof-tools";
              paths = [ pkgs.cosign pkgs.gnupg ];
            }
          ')
          export RELEASE_WATCH_COSIGN="$tools/bin/cosign"
          export RELEASE_WATCH_GPG="$tools/bin/gpg"
          watcher=$(node infra/release-watch/watch.mjs validate hosts/profile/releases.json)
          nix_versions=$(nix eval --json .#releaseVersions --no-write-lock-file)
          test "$watcher" = "$nix_versions"
          node infra/release-watch/watch.mjs resolve hosts/profile/releases.json | tee release-proof.json
          git diff --check

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/release-watch.yml infra/release-watch/watch.mjs infra/release-watch/watch.test.mjs
          actual=$(git diff --cached --name-only | LC_ALL=C sort)
          expected=$(printf '%s\n' .github/workflows/release-watch.yml infra/release-watch/watch.mjs infra/release-watch/watch.test.mjs | LC_ALL=C sort)
          test "$actual" = "$expected"
          git commit -m 'fix: close release-watch protocol lifecycle' \
            -m 'Bind checkout to canonical A, verify all bounded pages and actors, validate signed manifest version, use the real plural refs endpoint, and safely fast-forward a retained merged bot branch. Keep signature and selected-byte proofs mandatory.'
          final=$(git rev-parse HEAD)
          git push origin "HEAD:refs/heads/$BRANCH"
          printf 'final_head %s\nreleaseVersions %s\n' "$final" "$nix_versions" >> "$GITHUB_STEP_SUMMARY"
          cat release-proof.json >> "$GITHUB_STEP_SUMMARY"
          echo "FINAL_HEAD=$final" >> "$GITHUB_ENV"
      - name: Dispatch current-head checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/release-watch.yml/dispatches" -f ref="$BRANCH"
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches" -f ref="$BRANCH"
          printf 'dispatched release-watch and ci for %s\n' "$FINAL_HEAD" >> "$GITHUB_STEP_SUMMARY"
