name: ci

on:
  pull_request:
  push:
    branches: [proposals]
  workflow_dispatch:

jobs:
  scope:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      launcher_only: ${{ steps.scope.outputs.launcher_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          classify() {
            local path owner=false unrelated=false
            while IFS= read -r path; do
              case "$path" in
                '') ;;
                oci/dev/nix.nix|oci/dev/proof.sh) owner=true ;;
                .github/workflows/ci.yml) ;;
                *) unrelated=true ;;
              esac
            done <<< "$1"
            if [ "$owner" = true ] && [ "$unrelated" = false ]; then echo true; else echo false; fi
          }
          launcher_only=false
          if [ "$EVENT" = push ] || [ "$EVENT" = pull_request ]; then
            [[ $BEFORE =~ ^[0-9a-f]{40}$ && $BEFORE != 0000000000000000000000000000000000000000 ]] || { echo 'RED: missing comparison base' >&2; exit 1; }
            test "$(git rev-parse HEAD)" = "$EXPECTED" || { echo 'RED: source head mismatch' >&2; exit 1; }
            changes=$(git diff --name-only "$BEFORE" "$EXPECTED") || { echo 'RED: changed paths unavailable' >&2; exit 1; }
            launcher_only=$(classify "$changes")
          fi
          echo "launcher_only=$launcher_only" >> "$GITHUB_OUTPUT"

  own:
    needs: scope
    if: needs.scope.outputs.launcher_only != 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/own-image.yml
    with:
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/proposals' }}
    secrets: inherit

  rent:
    needs: scope
    if: needs.scope.outputs.launcher_only != 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/rent-image.yml
    with:
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/proposals' }}
    secrets: inherit

  dev:
    permissions:
      contents: read
    uses: ./.github/workflows/dev-image.yml

  build:
    needs: scope
    if: needs.scope.outputs.launcher_only != 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      source: ${{ steps.source.outputs.sha }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
      checksum: ${{ steps.source.outputs.checksum }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - run: nix flake check --no-write-lock-file --print-build-logs
      - run: nix build .#windows-dist --no-write-lock-file --print-build-logs
      - id: source
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "checksum=$(cut -d ' ' -f 1 result/windows-dist.zip.sha256)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: upload
        with:
          name: windows-dist
          path: |
            result/windows-dist.zip
            result/windows-dist.zip.sha256
          if-no-files-found: error
          retention-days: 7

  windows:
    permissions:
      contents: read
    needs: build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          path: source
      # hosts/own/win.ps1's Replace functions and its wslc wrapper under real Windows PowerShell 5.1, Stop and the
      # ordinary route's outer *>&1, against a fake wslc in RUNNER_TEMP that writes stderr on every call.
      - name: Own Replace under Windows PowerShell 5.1 with native stderr
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Path = "$PWD\source\hosts\own\win.ps1"
          $Errors = $null
          $Ast = [System.Management.Automation.Language.Parser]::ParseFile($Path, [ref] $null, [ref] $Errors)
          if ($Errors) { $Errors; exit 1 }
          $Site = Get-Content source\hosts\own\bindings\G6I3.json -Raw | ConvertFrom-Json
          $Spec = Get-Content source\hosts\own\spec.json -Raw | ConvertFrom-Json
          $Wrappers = @($Ast.FindAll({ param($n) $n -is [System.Management.Automation.Language.AssignmentStatementAst] -and
              $n.Left.Extent.Text -ceq '$Wslc' -and $n.Right.Extent.Text.TrimStart().StartsWith('{') }, $true))
          if ($Wrappers.Count -ne 1) { "expected one wslc wrapper, found $($Wrappers.Count)"; exit 1 }
          # The script's own Replace precheck: container inspect, the recorded rollback file and Get-RollbackProblem.
          $Prechecks = @($Ast.FindAll({ param($n) $n -is [System.Management.Automation.Language.IfStatementAst] -and
              $n.Clauses[0].Item1.Extent.Text -ceq "`$Step -eq 'Replace'" -and $n.Extent.Text.Contains('Get-RollbackProblem $Rollback') }, $true))
          if ($Prechecks.Count -ne 1) { "expected one Replace precheck, found $($Prechecks.Count)"; exit 1 }
          $Precheck = [scriptblock]::Create($Prechecks[0].Extent.Text)
          foreach ($N in $Ast.FindAll({ param($n)
              ($n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -in 'Get-Own', 'Get-Images', 'Test-RunningProof',
                'Wait-RunningProof', 'Get-RollbackProblem', 'Wait-OldRunning', 'Invoke-Seed', 'Complete-Replace', 'Test-OwnMount',
                'ConvertFrom-JsonItems') -or
              ($n -is [System.Management.Automation.Language.AssignmentStatementAst] -and $n.Left.Extent.Text -in '$Volumes', '$Proof') }, $true) + $Wrappers) {
            . ([scriptblock]::Create($N.Extent.Text))
          }
          function Start-Sleep { }
          $Tmp = Join-Path $env:RUNNER_TEMP ('own51-' + [guid]::NewGuid().ToString('N'))
          $null = New-Item -ItemType Directory -Path $Tmp
          $WslcExe = Join-Path $Tmp 'wslc.cmd'
          # Every call writes stderr; the seed (run --rm) is classified before a new container's run.
          Set-Content -LiteralPath $WslcExe -Encoding ascii -Value @'
          @echo off
          echo fake-wslc stderr %* 1>&2
          echo fake-wslc stderr second line 1>&2
          if "%1"=="container" goto inspect
          if "%1"=="logs" goto logs
          if "%1"=="run" goto run
          exit /b 0
          :inspect
          type "%FAKE_INSPECT%"
          exit /b 0
          :logs
          for /l %%i in (1,1,50) do echo fake-wslc container stderr %%i 1>&2
          if "%FAKE_GATE%"=="stderr" (echo %FAKE_PROOF% 1>&2) else (echo %FAKE_PROOF%)
          exit /b 0
          :run
          if "%2"=="--rm" exit /b %FAKE_SEED%
          echo %* | findstr /c:"OWN_NIX_VOLUME" >nul && exit /b %FAKE_RUN%
          exit /b 0
          '@
          $Image = $Site.image
          $OldImage = 'ghcr.io/roccho-dev/windows-own@sha256:' + ('1' * 64)
          $Pre = @('run', '--name', 'windows-own', '--detach', '--publish', '127.0.0.1:2223:2223', '--shm-size', '1G')
          $RunArgs = $Pre + @('--volume', 'windows-own-home:/home/dev', '--volume', 'windows-own-work:/work/repos', '--volume', 'windows-own-nix:/nix',
            '--env', 'OWN_HOME_VOLUME=windows-own-home', '--env', 'OWN_WORK_VOLUME=windows-own-work', '--env', 'OWN_NIX_VOLUME=windows-own-nix',
            '--env', 'OWN_AUTHORIZED_KEY=ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIA== ci', $Image)
          $SeedArgs = @('run', '--rm', '--volume', 'windows-own-nix:/seed', '--env', 'OWN_NIX_VOLUME=windows-own-nix', $Image, '/bin/own-nix-seed')
          $Good = $Pre + @('--volume', 'windows-own-home:/home/dev', $OldImage)
          $NewUp = Join-Path $Tmp 'new.json'; Set-Content -LiteralPath $NewUp -Encoding ascii -Value ('{"Name":"windows-own","State":{"Running":true},"Config":{"Image":"' + $Image + '"}}')
          $OldUp = Join-Path $Tmp 'old.json'; Set-Content -LiteralPath $OldUp -Encoding ascii -Value ('{"Name":"windows-own","State":{"Running":true},"Config":{"Image":"' + $OldImage + '"}}')
          $env:FAKE_PROOF = $Proof
          function Case([string]$Name, [hashtable]$Fake, [scriptblock]$Body) {
            foreach ($K in 'FAKE_INSPECT', 'FAKE_GATE', 'FAKE_SEED', 'FAKE_RUN') { Set-Item "env:$K" '0' }
            $env:FAKE_GATE = 'stdout'
            foreach ($K in $Fake.Keys) { Set-Item "env:$K" $Fake[$K] }
            $Log = Join-Path $Tmp "$Name.log"
            $Result = try { & $Body *>&1 | Out-File -LiteralPath $Log -Encoding utf8; 'ok' } catch { $_.Exception.Message }
            [pscustomobject]@{ result = $Result; code = $global:LASTEXITCODE; log = [IO.File]::ReadAllText($Log) }
          }
          $A = Case 'a' @{ FAKE_INSPECT = $NewUp } { Complete-Replace $Good }
          if ($A.result -cne 'ok' -or $A.log -notmatch 'fake-wslc stderr') { "A: Replace did not succeed with stderr on every call: $($A.result)"; $A.log; exit 1 }
          $B = Case 'b' @{ FAKE_INSPECT = $OldUp; FAKE_RUN = '7' } { Complete-Replace $Good }
          $WantB = 'Replace failed: WSLC run failed: 7 | rollback succeeded: stop new exit 0; remove new exit 0; recorded argv exit 0; old Running on its old image'
          if ($B.result -cne $WantB) { "B: $($B.result)"; $B.log; exit 1 }
          # A' and B': the same success and rollback with the container inspect as a one-element JSON array.
          $NewUpList = Join-Path $Tmp 'new-list.json'; Set-Content -LiteralPath $NewUpList -Encoding ascii -Value ('[' + [IO.File]::ReadAllText($NewUp).Trim() + ']')
          $OldUpList = Join-Path $Tmp 'old-up-list.json'; Set-Content -LiteralPath $OldUpList -Encoding ascii -Value ('[' + [IO.File]::ReadAllText($OldUp).Trim() + ']')
          $A2 = Case 'a2' @{ FAKE_INSPECT = $NewUpList } { Complete-Replace $Good }
          if ($A2.result -cne 'ok' -or $A2.log -notmatch 'fake-wslc stderr') { "A': Replace did not succeed with an array inspect: $($A2.result)"; $A2.log; exit 1 }
          $B2 = Case 'b2' @{ FAKE_INSPECT = $OldUpList; FAKE_RUN = '7' } { Complete-Replace $Good }
          if ($B2.result -cne $WantB) { "B': $($B2.result)"; $B2.log; exit 1 }
          $script:Gate = $null
          $C = Case 'c' @{ FAKE_INSPECT = $NewUp; FAKE_GATE = 'stderr' } { $script:Gate = Wait-RunningProof }
          if ($C.result -cne 'ok' -or $script:Gate -ne $false) { "C: an own-mounts line on stderr only passed the gate: $($C.result) $script:Gate"; exit 1 }
          $D = Case 'd' @{ FAKE_SEED = '3' } { Invoke-Seed }
          if ($D.result -cne 'WSLC seed failed: 3' -or $D.code -ne 3) { "D: $($D.result) exit $($D.code)"; exit 1 }
          # E: the precheck reads a rollback file written as a flat JSON array of strings and accepts it unchanged, with the
          # container inspect as one object or as a one-element array; a nested, typed or object file is still refused.
          $OldMounted = '{"Name":"windows-own","State":{"Running":true},"Config":{"Image":"' + $OldImage +
            '"},"Mounts":[{"Type":"volume","Name":"windows-own-home","Destination":"/home/dev"}]}'
          $OldOne = Join-Path $Tmp 'old-one.json'; Set-Content -LiteralPath $OldOne -Encoding ascii -Value $OldMounted
          $OldList = Join-Path $Tmp 'old-list.json'; Set-Content -LiteralPath $OldList -Encoding ascii -Value "[$OldMounted]"
          $GoodJson = ConvertTo-Json -InputObject $Good -Compress
          $Argvs = [ordered] @{ good = $GoodJson; nested = "[$GoodJson]"; typed = $GoodJson.Replace('"--detach"', '1'); object = '{"argv":' + $GoodJson + '}' }
          foreach ($K in $Argvs.Keys) { Set-Content -LiteralPath (Join-Path $Tmp "$K.argv.json") -Encoding ascii -Value $Argvs[$K] }
          foreach ($Inspect in $OldOne, $OldList) {
            foreach ($K in $Argvs.Keys) {
              $script:ArgvFile = Join-Path $Tmp "$K.argv.json"; $script:Parsed = $null
              $E = Case "e-$K" @{ FAKE_INSPECT = $Inspect } { $Step = 'Replace'; $RollbackArgvFile = $script:ArgvFile; . $Precheck; $script:Parsed = $Rollback }
              $Want = if ($K -ceq 'good') { 'ok' } else { 'Rollback argv must be a JSON array of strings. Not replacing.' }
              if ($E.result -cne $Want -or ($K -ceq 'good' -and (@($script:Parsed) -join "`n") -cne ($Good -join "`n"))) {
                "E: $K rollback file with inspect $(Split-Path -Leaf $Inspect): $($E.result)"; $E.log; exit 1
              }
              Remove-Item -LiteralPath (Join-Path $Tmp "e-$K.log")
            }
          }
          # F: Get-Own returns the one container from an inspect object or one-element array, and refuses two.
          $OldTwo = Join-Path $Tmp 'old-two.json'; Set-Content -LiteralPath $OldTwo -Encoding ascii -Value "[$OldMounted,$OldMounted]"
          foreach ($Inspect in $OldOne, $OldList, $OldTwo) {
            $script:Own = $null
            $F = Case 'f' @{ FAKE_INSPECT = $Inspect } { $script:Own = Get-Own }
            $Want = if ($Inspect -ceq $OldTwo) { 'Expected one container named windows-own.' } else { 'ok' }
            if ($F.result -cne $Want -or ($Want -ceq 'ok' -and ($script:Own -isnot [pscustomobject] -or $script:Own.Config.Image -cne $OldImage))) {
              "F: Get-Own with inspect $(Split-Path -Leaf $Inspect): $($F.result)"; $F.log; exit 1
            }
            Remove-Item -LiteralPath (Join-Path $Tmp 'f.log')
          }
          # G: hosts/common/win.ps1's HostTaskPolicies, loaded with its real helpers, queries this runner's actual policies
          # through a real child Windows PowerShell, once here under 5.1 and once under pwsh 7. The logon task runs Windows
          # PowerShell, so the reference values are this 5.1 process's own Get-ExecutionPolicy per persisted scope.
          $GScript = Join-Path $Tmp 'g.ps1'
          Set-Content -LiteralPath $GScript -Encoding utf8 -Value @'
          param([string] $Root, [string] $Reference, [string] $ChildModulePath)
          $ErrorActionPreference = 'Stop'
          Import-Module Microsoft.PowerShell.Utility, Microsoft.PowerShell.Management
          $Loaded = @{}
          foreach ($Source in @(@('hosts\common\win.ps1', @('Invoke-Native', 'HostTaskPolicies')),
              @('hosts\common\handoff-evaluate.ps1', @('Join-NativeArguments', 'Get-Field', 'Get-OwnTaskPolicyProblem')))) {
            $Errors = $null
            $Ast = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $Root $Source[0]), [ref] $null, [ref] $Errors)
            if ($Errors) { throw "G: $($Source[0]) does not parse" }
            foreach ($Name in $Source[1]) {
              $Found = @($Ast.FindAll({ param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -ceq $Name }, $true))
              if ($Found.Count -ne 1) { throw "G: expected one $Name, found $($Found.Count)" }
              . ([scriptblock]::Create($Found[0].Extent.Text)); $Loaded[$Name] = $Found[0]
            }
          }
          $Major = $PSVersionTable.PSVersion.Major
          # Invoke-Native passes its environment on; under pwsh the child Windows PowerShell would inherit pwsh's module
          # path and fail to load Get-ExecutionPolicy. Production starts from Windows PowerShell, so give the child that path.
          if ($Major -ge 7) { $env:PSModulePath = $ChildModulePath; 'G diagnostic: the child gets the Windows PowerShell module path' }
          # Regression control: the M2 expression on the same native output nests the array on 5.1 and is flat on 7.
          $Query = @($Loaded['HostTaskPolicies'].Body.FindAll({ param($n) $n -is [System.Management.Automation.Language.AssignmentStatementAst] -and
            $n.Left.Extent.Text -cin '$exe', '$policies' }, $true))
          if (($Query.Left.Extent.Text -join ',') -cne '$exe,$policies') { throw "G: expected the executable and native policy query, found $($Query.Count)" }
          foreach ($Statement in $Query) { . ([scriptblock]::Create($Statement.Extent.Text)) }
          function OldShape { return $policies | ConvertFrom-Json }
          $Old = @(OldShape)
          $OldOk = if ($Major -ge 7) { $Old.Count -eq 5 } else { $Old.Count -eq 1 -and $Old[0] -is [array] -and @($Old[0]).Count -eq 5 }
          if (-not $OldOk) { throw "G: old expression on PowerShell ${Major}: $($Old.Count) item(s)" }
          $Rows = @(HostTaskPolicies)
          if ($Rows.Count -ne 5) { throw "G: expected 5 policy rows, got $($Rows.Count): $(@($Rows | ForEach-Object { $_.GetType().FullName }) -join ',')" }
          $Valid = [enum]::GetNames([Microsoft.PowerShell.ExecutionPolicy])
          $Child = @{}
          foreach ($Row in $Rows) {
            if ($Row -isnot [System.Management.Automation.PSCustomObject] -or
                ((@($Row.PSObject.Properties.Name) | Sort-Object) -join ',') -cne 'ExecutionPolicy,Scope' -or
                $Row.Scope -isnot [string] -or $Row.ExecutionPolicy -isnot [string] -or $Valid -cnotcontains $Row.ExecutionPolicy) {
              throw "G: malformed policy row: $($Row | ConvertTo-Json -Compress)"
            }
            $Child[$Row.Scope] = $Row.ExecutionPolicy
          }
          $Scopes = 'MachinePolicy', 'UserPolicy', 'Process', 'CurrentUser', 'LocalMachine'
          if (((@($Rows.Scope) | Sort-Object) -join ',') -cne ((@($Scopes) | Sort-Object) -join ',')) { throw "G: scopes $(@($Rows.Scope) -join ',')" }
          $Parent = @{}
          foreach ($Pair in $Reference.Split(',')) { $Parent[$Pair.Split('=')[0]] = $Pair.Split('=')[1] }
          $Persisted = 'MachinePolicy', 'UserPolicy', 'CurrentUser', 'LocalMachine'
          foreach ($Scope in $Persisted) {
            if ($Child[$Scope] -cne $Parent[$Scope]) { throw "G: $Scope child $($Child[$Scope]) parent $($Parent[$Scope])" }
          }
          # The decision, computed independently: the first persisted scope that is not Undefined; Process never counts.
          $Expected = 'Default Restricted task execution policy blocks unsigned runtime; policy is not changed.'
          foreach ($Scope in $Persisted) {
            if ($Parent[$Scope] -ceq 'Undefined') { continue }
            $Expected = if ($Parent[$Scope] -cin 'RemoteSigned', 'Unrestricted', 'Bypass') { '' } else { 'Existing task execution policy blocks unsigned runtime; policy is not changed.' }
            break
          }
          $Got = [string] (Get-OwnTaskPolicyProblem $Rows)
          if ($Got -cne $Expected) { throw "G: decision '$Got', expected '$Expected'" }
          "G diagnostic: Process child $($Child['Process']), parent $($Parent['Process'])"
          ('G real task policy rows on PowerShell ' + $Major)
          '@
          $Reference = (@('MachinePolicy', 'UserPolicy', 'Process', 'CurrentUser', 'LocalMachine') |
            ForEach-Object { $_ + '=' + [string] (Get-ExecutionPolicy -Scope $_) }) -join ','
          $G5 = @(& $GScript -Root "$PWD\source" -Reference $Reference -ChildModulePath $env:PSModulePath)
          $G7 = @(& pwsh -NoProfile -NonInteractive -File $GScript -Root "$PWD\source" -Reference $Reference -ChildModulePath $env:PSModulePath)
          if ($LASTEXITCODE -ne 0 -or $G5 -cnotcontains ('G real task policy rows on PowerShell ' + '5') -or
              $G7 -cnotcontains ('G real task policy rows on PowerShell ' + '7')) { 'G:'; $G5; $G7; exit 1 }
          $G5; $G7
          foreach ($F in 'a', 'b', 'a2', 'b2', 'c', 'd') { Remove-Item -LiteralPath (Join-Path $Tmp "$F.log") }
          foreach ($K in $Argvs.Keys) { Remove-Item -LiteralPath (Join-Path $Tmp "$K.argv.json") }
          foreach ($F in $WslcExe, $NewUp, $OldUp, $NewUpList, $OldUpList, $OldOne, $OldList, $OldTwo, $GScript) { Remove-Item -LiteralPath $F }
          [IO.Directory]::Delete($Tmp)
          ("PASS own Replace under Windows PowerShell 5.1: A success, B rollback after remove, A' and B' with an array inspect, " +
            'C stderr-only gate refused, D seed exit 3, E rollback file precheck, F one container from inspect, ' +
            'G real task policy rows under 5.1 and 7')
          exit 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          merge-multiple: true
      - shell: pwsh
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.checksum }}
          EXPECTED_SOURCE: ${{ needs.build.outputs.source }}
        run: |
          if ((Get-FileHash windows-dist.zip -Algorithm SHA256).Hash -ne $env:EXPECTED_SHA256) { throw 'Transport checksum mismatch' }
          Expand-Archive windows-dist.zip bundle
          & ./bundle/proof.ps1 -ExpectedSource $env:EXPECTED_SOURCE

  # One Release per source: the proved Windows distribution and rent-image.json, the rent image this same run
  # tested and pushed (by registry digest), so a consumer binds both to the source and runs the image by digest.
  publish:
    needs: [scope, build, windows, rent]
    if: needs.scope.outputs.launcher_only != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/proposals'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE: ${{ needs.build.outputs.source }}
          EXPECTED_SHA256: ${{ needs.build.outputs.checksum }}
          RENT_IMAGE: ${{ needs.rent.outputs.image }}
        run: |
          set -euo pipefail
          test "$SOURCE" = "$GITHUB_SHA"
          printf '%s  windows-dist.zip\n' "$EXPECTED_SHA256" | sha256sum --check --strict
          [[ $RENT_IMAGE =~ ^ghcr\.io/roccho-dev/windows-rent@sha256:[0-9a-f]{64}$ ]] || { echo 'RED: no pushed rent image digest from this run' >&2; exit 1; }
          jq -n --arg source "$SOURCE" --arg image "$RENT_IMAGE" \
            '{kind: "windows.rentImage.v1", source: $source, image: $image}' > rent-image.json
          gh release create "windows-$SOURCE" windows-dist.zip windows-dist.zip.sha256 rent-image.json \
            --target "$SOURCE" --title "Windows $SOURCE" --latest=false \
            --notes "Exact artifacts from this run's passing build, Windows proof and rent image job (stub-twin smoke plus limited checks of the pushed image); source $SOURCE. Real-host UX, WSLC and Cloudflare are not claimed."
