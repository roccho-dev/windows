name: ci

on:
  pull_request:
  push:
    branches: [proposals]
  workflow_dispatch:

jobs:
  own:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/own-image.yml
    with:
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/proposals' }}
    secrets: inherit

  rent:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/rent-image.yml
    with:
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/proposals' }}
    secrets: inherit

  dev:
    permissions:
      contents: read
    uses: ./.github/workflows/dev-image.yml

  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      source: ${{ steps.source.outputs.sha }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
      checksum: ${{ steps.source.outputs.checksum }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - run: nix flake check --no-write-lock-file --print-build-logs
      - run: nix build .#windows-dist --no-write-lock-file --print-build-logs
      - id: source
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "checksum=$(cut -d ' ' -f 1 result/windows-dist.zip.sha256)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: upload
        with:
          name: windows-dist
          path: |
            result/windows-dist.zip
            result/windows-dist.zip.sha256
          if-no-files-found: error
          retention-days: 7

  windows:
    permissions:
      contents: read
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          merge-multiple: true
      - shell: pwsh
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.checksum }}
          EXPECTED_SOURCE: ${{ needs.build.outputs.source }}
        run: |
          if ((Get-FileHash windows-dist.zip -Algorithm SHA256).Hash -ne $env:EXPECTED_SHA256) { throw 'Transport checksum mismatch' }
          Expand-Archive windows-dist.zip bundle
          & ./bundle/proof.ps1 -ExpectedSource $env:EXPECTED_SOURCE

  publish:
    needs: [build, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/proposals'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE: ${{ needs.build.outputs.source }}
          EXPECTED_SHA256: ${{ needs.build.outputs.checksum }}
        run: |
          test "$SOURCE" = "$GITHUB_SHA"
          printf '%s  windows-dist.zip\n' "$EXPECTED_SHA256" | sha256sum --check --strict
          gh release create "windows-$SOURCE" windows-dist.zip windows-dist.zip.sha256 \
            --target "$SOURCE" --title "Windows $SOURCE" --latest=false \
            --notes "Exact artifact from passing build and Windows proof; source $SOURCE. Real-host UX is not claimed."
