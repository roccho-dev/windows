          $Held = { param($F, $W) "Stage halted: $F | $W; windows-rent kept stopped, windows-rent-cf left as found, logon task not restored, state UNKNOWN; recovery needs separate authority." }
          # The typed import, its selected items appended to the Plan's migrate argv; seeding with an expected backing.
          $Imp = @($Plan.migrate | Select-Object -Skip 1) + 'session' + 'codex'; $I = $Imp -join ' '; $Ipre = @($Place, $List, $S, 'inspect envs-dev-mutable', $List, $I)
          $SE = (@($SeedArgs[0..5]) + @('--env', 'RENT_NIX_EXPECT=8:32 /volumes/windows-rent-nix/_data') + @($SeedArgs[6..7])) -join ' '
