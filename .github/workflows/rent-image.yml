          $Reverts = [ordered]@{
            'revert keeps the candidate' = @{ Old = { $OldUpJson }; Cand = { param($N) if ($N -eq 1) { $CandUp } else { $CandDown } }
              Want = "True | stop candidate exit 0; $Stopped; $Ok"; Calls = @('inspect windows-rent-cf', 'stop windows-rent-cf', 'inspect windows-rent-cf') + $Back }
            'revert, stop exits 0 but the candidate keeps running' = @{ Old = { $OldUpJson }; Cand = { $CandUp }
