          $PlaceArgs = @($Plan.stagePlace | Select-Object -Skip 1)
          $Placement = {
            $Calls.Add('place ' + (@($args) -join ' '))
            if ($Case.PlaceThrow) { throw 'fake placement process failure' }
            $global:LASTEXITCODE = if ($Case.ContainsKey('PlaceExit')) { $Case.PlaceExit } else { 0 }
            'placement output'
          }
          $Wslc = {
            $A = @($args) -join ' '
            $Calls.Add($A)
            $global:LASTEXITCODE = if ($Case.Exit -and $Case.Exit.ContainsKey($A)) { $Case.Exit[$A] } else { 0 }
            $Out = switch -CaseSensitive ($A) {
              'inspect windows-rent' { $Case.OldSeen++; & $Case.Old $Case.OldSeen }
              'inspect windows-rent-cf' { $Case.CandSeen++; & $Case.Cand $Case.CandSeen }
              'logs windows-rent-cf' { if ($Case.Logs) { $Case.Logs } else { @($Proof, $Ready) } }
              'container list --all -q' { $Case.ListSeen++; if ($Case.List -is [scriptblock]) { & $Case.List $Case.ListSeen } else { $Case.List } }
              'inspect other' { $Case.Other }
              'inspect ghost' { $null }
              'inspect envs-dev-mutable' { '{"Name":"envs-dev-mutable","State":{"Running":false,"Status":"exited"},"Config":{"Image":"' + $OldImageSource + '"}}' }
