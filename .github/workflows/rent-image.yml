              Want = "Stage failed: $Rejected | revert FAILED: stop candidate exit 0; candidate not provably stopped" }
            'kept rent does not come back' = @{ Exit = @{ $S = 1 }; Old = { $OldDownJson }; Cand = { $null }; Calls = @($Place, $List, $S, 'inspect windows-rent-cf') + $NoBack
              Want = "Stage failed: WSLC seed failed: 1 | revert FAILED: $NotOk" }
            'kept rent back on other image' = @{ Exit = @{ $S = 1 }; Old = { $OldUpJson.Replace($Live, $Other) }; Cand = { $null }
              Calls = @($Place, $List, $S, 'inspect windows-rent-cf') + $NoBack
              Want = "Stage failed: WSLC seed failed: 1 | revert FAILED: $NotOk" }
            'candidate readback names another container' = @{ Old = { $OldUpJson }; Cand = { $CandUp.Replace('"Name":"windows-rent-cf"', '"Name":"windows-rent"') }
              Calls = $Pre + @('inspect windows-rent-cf', 'inspect windows-rent-cf')
              Want = 'Stage failed: Inspect of windows-rent-cf returned windows-rent. | revert FAILED: error: Inspect of windows-rent-cf returned windows-rent.' }
            'kept rent readback names another container' = @{ Exit = @{ $S = 1 }; Old = { $OldUpJson.Replace('"Name":"windows-rent"', '"Name":"other"') }; Cand = { $null }
