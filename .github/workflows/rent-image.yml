            'run fails after an updated import: halt' = @{ Items = $true; Exit = @{ $I = 10; $SA = 1 }; Old = { $OldUpJson }; Cand = { $null }; Calls = $Ipre + @($SA)
              Want = (& $Held 'WSLC run of windows-rent-cf failed: 1' 'the import updated the state') }
            'run fails after an unchanged import: revert' = @{ Items = $true; Exit = @{ $SA = 1 }; Old = { $OldUpJson }; Cand = { $null }
              Calls = $Ipre + @($SA, 'inspect windows-rent-cf') + $Back; Want = "Stage failed: WSLC run of windows-rent-cf failed: 1 | revert succeeded: $Ok" }
            'import refused with no target changed: revert' = @{ Items = $true; Exit = @{ $I = 20 }; Old = { $OldUpJson }; Cand = { $null }
              Calls = $Ipre + @('inspect windows-rent-cf') + $Back; Want = "Stage failed: WSLC import refused with no target changed | revert succeeded: $Ok" }
            'import restored every item: revert' = @{ Items = $true; Exit = @{ $I = 21 }; Old = { $OldUpJson }; Cand = { $null }
              Calls = $Ipre + @('inspect windows-rent-cf') + $Back; Want = "Stage failed: WSLC import failed and restored every changed item | revert succeeded: $Ok" }
            'import outcome unknown: halt' = @{ Items = $true; Exit = @{ $I = 30 }; Old = { $OldUpJson }; Cand = { $null }; Calls = $Ipre
              Want = (& $Held 'WSLC import: the import outcome is unknown (exit 30).' 'the import outcome is unknown (exit 30)') }
          }
          foreach ($K in $Cases.Keys) {
            $Case = $Cases[$K]; $Calls = [System.Collections.Generic.List[string]]::new()
            $script:Anchors = if ($Case.Anchored) { @{ 'windows-rent-nix' = @{ Dev = '8:32'; Root = '/volumes/windows-rent-nix/_data' } } } else { $null }
            $ImportItems = if ($Case.Items) { @('session', 'codex') } else { @() }; $MigrateArgs = $Imp
