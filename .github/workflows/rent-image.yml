          $NotOk = 'task starts windows-rent; start old exit 0; old not Running on its images within 60 s'
          $Stopped = 'candidate provably stopped'
          $Upto61 = { param($N) if ($N -le 61) { $CandUp } else { $CandDown } }
          $Rejected = "windows-rent-cf did not stay Running with '$Proof' and '$Ready'."
          function Assert-Case($K, $Got) {
            if ($Got -cne $Case.Want -or ($Calls -join "`n") -cne ($Case.Calls -join "`n")) { "case '$K' gave: $Got"; $Calls; exit 1 }
            if (@($Calls) -cmatch '(^| )(-f|-v|--force|--volumes)( |$)|^volume (remove|rm|prune)|^(remove|rm) windows-rent$') { "case '$K' forced, removed a volume or the kept rent"; exit 1 }
            if (@($Calls) -match '(?i)AGE-SECRET-KEY|TUNNEL_TOKEN|--token' -or $Got -match '(?i)AGE-SECRET-KEY|TUNNEL_TOKEN') { "case '$K' carried a credential"; exit 1 }
