            'writer appears before the kept rent restarts' = @{ Exit = @{ $SA = 1 }; List = { param($N) if ($N -ge 2) { 'other' } }
              Other = $OtherRunning | ConvertTo-Json -Compress; Old = { $OldUpJson }; Cand = { $null }
