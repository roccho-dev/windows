name: rent image

on:
  push:
    branches: [main, feat/rent-ci]
    paths: ["flake.nix", "flake.lock", "hosts/rent/**", ".github/workflows/rent-image.yml"]

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build from locked Nix inputs
        run: nix build .#rent-image --no-write-lock-file --print-build-logs
      - name: Load and test SSH and persistent home
        shell: bash
        run: |
          set -euo pipefail
          docker load < result
          key_dir="$(mktemp -d)"
          trap 'docker rm -f rent-smoke >/dev/null 2>&1 || true; docker volume rm rent-smoke-home >/dev/null 2>&1 || true; rm -rf "$key_dir"' EXIT
          ssh-keygen -q -t ed25519 -N '' -f "$key_dir/key"
          docker volume create rent-smoke-home
          docker run -d --name rent-smoke -p 127.0.0.1:2222:2222 \
            -v rent-smoke-home:/home/dev \
            -e "RENT_AUTHORIZED_KEY=$(cat "$key_dir/key.pub")" \
            ghcr.io/roccho-dev/windows-rent:nix
          ssh_cmd=(ssh -F /dev/null -p 2222 -i "$key_dir/key" -o IdentitiesOnly=yes \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -o "UserKnownHostsFile=$key_dir/known_hosts" dev@127.0.0.1)
          for attempt in {1..20}; do
            if "${ssh_cmd[@]}" id -un > "$key_dir/answer" 2>/dev/null; then break; fi
            sleep 1
          done
          test "$(cat "$key_dir/answer")" = dev
          "${ssh_cmd[@]}" 'set -eu
            if command -v nix-instantiate >/dev/null; then exit 1; fi
            command -v git >/dev/null
            test -r "$SSL_CERT_FILE"
            git --version >/dev/null
            git ls-remote --exit-code https://github.com/roccho-dev/windows.git HEAD >/dev/null'
          "${ssh_cmd[@]}" 'echo persisted > /home/dev/proof'
          before="$(docker inspect --format '{{.Id}}' rent-smoke)"
          docker restart rent-smoke
          test "$(docker inspect --format '{{.Id}}' rent-smoke)" = "$before"
          for attempt in {1..20}; do
            if "${ssh_cmd[@]}" cat /home/dev/proof > "$key_dir/answer" 2>/dev/null; then break; fi
            sleep 1
          done
          test "$(cat "$key_dir/answer")" = persisted
      - name: Publish exact image from this repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/roccho-dev/windows-rent:sha-${GITHUB_SHA}"
          docker tag ghcr.io/roccho-dev/windows-rent:nix "$image"
          docker push "$image"
          docker image inspect "$image" --format '{{index .RepoDigests 0}}' >> "$GITHUB_STEP_SUMMARY"
