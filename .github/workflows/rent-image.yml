              Want = "Stage failed: WSLC run of windows-rent-cf failed: 1 | revert FAILED: $Writer" }
            'unreadable container before the kept rent restarts' = @{ Exit = @{ $SA = 1 }; List = { param($N) if ($N -ge 2) { 'ghost' } }; Old = { $OldUpJson }; Cand = { $null }
