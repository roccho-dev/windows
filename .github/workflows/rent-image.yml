            'revert, task cannot be pointed back' = @{ TaskFail = @('windows-rent'); Old = { $OldUpJson }; Cand = { param($N) if ($N -eq 1) { $CandUp } else { $CandDown } }
              Want = "False | stop candidate exit 0; $Stopped; task not restored (fake task failure for windows-rent); not starting windows-rent"
              Calls = @('inspect windows-rent-cf', 'stop windows-rent-cf', 'inspect windows-rent-cf', $List, 'task -> windows-rent') }
            'revert, kept candidate listed and stopped' = @{ List = 'windows-rent-cf'; Old = { $OldUpJson }; Cand = { param($N) if ($N -eq 1) { $CandUp } else { $CandDown } }
              Want = "True | stop candidate exit 0; $Stopped; $Ok"
              Calls = @('inspect windows-rent-cf', 'stop windows-rent-cf', 'inspect windows-rent-cf', $List, 'inspect windows-rent-cf') + @($Back | Select-Object -Skip 1) }
            'revert, another writer running' = @{ List = 'other'; Other = $OtherRunning | ConvertTo-Json -Compress; Old = { $OldUpJson }
              Cand = { param($N) if ($N -eq 1) { $CandUp } else { $CandDown } }
              Want = "False | stop candidate exit 0; $Stopped; $Writer"; Calls = @('inspect windows-rent-cf', 'stop windows-rent-cf', 'inspect windows-rent-cf', $List, 'inspect other') }
