              if ($C -ceq 'task -> windows-rent') { $AtOld = $true }
              if ($C -ceq 'start windows-rent' -and $Seen -and -not $AtOld) { "case '$K' started the kept rent while the task could start the candidate"; exit 1 }
            }
          }
          $Cases = [ordered]@{
            'ready' = @{ Old = { $OldUpJson }; Cand = { $CandUp }; Want = 'ok'; Calls = $Pre + @(1..10 | ForEach-Object { $Pair }) }
            'placement exit 2 halts' = @{ PlaceExit = 2; Old = { $OldUpJson }; Cand = { $null }; Calls = @($Place); Want = (& $PlaceHaltWant 'exit 2') }
            'placement exit 1 halts' = @{ PlaceExit = 1; Old = { $OldUpJson }; Cand = { $null }; Calls = @($Place); Want = (& $PlaceHaltWant 'exit 1') }
            'placement timeout -1 halts' = @{ PlaceExit = -1; Old = { $OldUpJson }; Cand = { $null }; Calls = @($Place); Want = (& $PlaceHaltWant 'exit -1') }
            'placement exception halts' = @{ PlaceThrow = $true; Old = { $OldUpJson }; Cand = { $null }; Calls = @($Place); Want = (& $PlaceHaltWant 'an exception') }
            # A writer that keeps running: the seed guard refuses, and so does the revert's guard; the kept rent stays stopped.
            'another container running' = @{ List = 'other'; Other = $OtherRunning | ConvertTo-Json -Compress; Old = { $OldUpJson }; Cand = { $null }
              Calls = @($Place, $List, 'inspect other', 'inspect windows-rent-cf', $List, 'inspect other')
