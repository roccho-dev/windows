name: rent image

on:
  workflow_call:
    inputs:
      publish:
        description: Publish the exact tested image
        required: false
        type: boolean
        default: false
    outputs:
      image:
        description: The pushed image of this source by registry digest (ghcr.io/roccho-dev/windows-rent@sha256:<64 hex>); empty unless published
        value: ${{ jobs.build-test-publish.outputs.image }}

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Parse and dry-plan the Windows script (no WSLC, no live effect)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Path = "$PWD/hosts/rent/win.ps1"
          $Errors = $null
          $Ast = [System.Management.Automation.Language.Parser]::ParseFile($Path, [ref] $null, [ref] $Errors)
          if ($Errors) { $Errors; exit 1 }
          if ($Ast.ScriptRequirements.RequiredPSVersion -ne [version] '7.0') { 'win.ps1 must require PowerShell 7'; exit 1 }
          $env:COMPUTERNAME = 'CI-HOST'
          $Image = 'ghcr.io/roccho-dev/windows-rent@sha256:' + ('0' * 64)
          $Base = @{ Step = 'Plan'; ExpectHost = 'CI-HOST'; Container = 'windows-rent'; Port = 2222; Image = $Image; PublicKeyFile = 'ci.pub' }
          $PlanJson = (& $Path @Base) -join "`n"
          $Plan = $PlanJson | ConvertFrom-Json
          $W = 'C:\Program Files\WSL\wslc.exe'
          $Volumes = @('--volume', 'repos:/work/repos', '--volume', 'windows-rent-state:/var/lib/rent', '--volume', 'windows-rent-nix:/nix',
            '--env', 'RENT_REPOS_VOLUME=repos', '--env', 'RENT_STATE_VOLUME=windows-rent-state', '--env', 'RENT_NIX_VOLUME=windows-rent-nix',
            '--env', 'RENT_AUTHORIZED_KEY=<contents of ci.pub>', $Image)
          $Want = [ordered]@{
            create = @($W, 'run', '--name', 'windows-rent', '--detach', '--publish', '127.0.0.1:2222:2222') + $Volumes
            stageRun = @($W, 'run', '--name', 'windows-rent-cf', '--detach', '--publish', '127.0.0.1:2222:2222') + $Volumes
            stageStop = @($W, 'stop', 'windows-rent')
            readyLogs = @($W, 'logs', 'windows-rent-cf')
            revertStop = @($W, 'stop', 'windows-rent-cf')
            revertRemove = @($W, 'remove', 'windows-rent-cf')
            revertStart = @($W, 'start', 'windows-rent')
            stageTask = @('windows-rent-oci-logon', $W, 'start', 'windows-rent-cf')
            revertTask = @('windows-rent-oci-logon', $W, 'start', 'windows-rent')
            logonTask = @('windows-rent-oci-logon', $W, 'start', 'windows-rent')
            nixVolumeCreateOnce = @($W, 'volume', 'create', 'windows-rent-nix')
            seedContainerList = @($W, 'container', 'list', '--all', '-q')
            seed = @($W, 'run', '--rm', '--volume', 'windows-rent-nix:/seed', '--env', 'RENT_NIX_VOLUME=windows-rent-nix', $Image, '/bin/rent-nix-seed')
            migrate = @($W, 'run', '--rm', '--volume', 'dev-home:/old:ro', '--volume', 'windows-rent-state:/var/lib/rent',
              '--env', 'RENT_OLD_VOLUME=dev-home', '--env', 'RENT_STATE_VOLUME=windows-rent-state',
              $Image, '/bin/rent-state-import', '4eba321e-6ade-4815-930d-dfa58b6fc960')
            stateVolumeCreateOnce = @($W, 'volume', 'create', 'windows-rent-state')
            migrateSourceInspect = @($W, 'inspect', 'envs-dev-mutable')
            migrateContainerList = @($W, 'container', 'list', '--all', '-q')
            # Stage's token placement: its own Windows PowerShell 5.1 process, paths and the image digest only.
            stagePlace = @('C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe', '-NoProfile', '-NonInteractive', '-File',
              (Join-Path '<placement distribution>' 'place.ps1'), '-Target', 'rent', '-Identity', '<rent age identity>',
              '-Ciphertext', (Join-Path (Join-Path '<placement distribution>' 'ciphertexts') 'dev-rent-tunnel.sops.yaml'), '-RentImage', $Image)
          }
          foreach ($K in $Want.Keys) {
            if ((@($Plan.$K) -join "`n") -cne ($Want[$K] -join "`n")) { "$K differs: $(@($Plan.$K) -join ' ')"; exit 1 }
          }
          $ProjectPlan = ((& $Path @Base -SessionProject '-mieru-proof') -join "`n") | ConvertFrom-Json
          if (($ProjectPlan.migrate -join "`n") -cne (($Want.migrate[0..($Want.migrate.Count - 2)] + @('--project', '-mieru-proof', $Want.migrate[-1])) -join "`n")) {
            'session project is not forwarded to the production importer'; exit 1
          }
          foreach ($BadProject in '', '.', '..', '../x', '/x', 'x/y', 'x\y', 'C:x') {
            $Rejected = $false
            try { $null = & $Path @Base -SessionProject $BadProject } catch { $Rejected = $true }
            if (-not $Rejected) { "unsafe project accepted: $BadProject"; exit 1 }
          }
          if ($Plan.readyGate -notlike "*'rent-mounts ok repos=repos state=windows-rent-state nix=windows-rent-nix'*'rent-start ok services=nix-daemon,cloudflared,sshd'*") { 'readyGate differs'; exit 1 }
          # The candidate takes over exactly the kept rent's loopback port (free only once it is stopped), and exactly one
          # logon task exists, repointed by name: no second task can start a second rent on the same volumes.
          if ($Plan.stageRun[5] -cne '--publish' -or $Plan.stageRun[6] -cne '127.0.0.1:2222:2222' -or $Plan.stageRun[6] -cne $Plan.create[6] -or
              @($Plan.stageRun | Where-Object { $_ -ceq '--publish' }).Count -ne 1) { 'candidate port differs from the kept rent'; exit 1 }
          $Tasks = @($Ast.FindAll({ param($n) $n -is [System.Management.Automation.Language.CommandAst] -and $n.GetCommandName() -in 'Register-ScheduledTask', 'New-ScheduledTask' }, $true))
          if ($Tasks.Count -ne 1 -or $Tasks[0].Extent.Text -notmatch '-TaskName \$TaskName ') { 'logon task is not the one fixed name'; exit 1 }
          if ($Ast.Extent.Text -notmatch "(?m)^\`$TaskName = 'windows-rent-oci-logon'$") { 'logon task name is not fixed'; exit 1 }
          # No Tailscale and no token anywhere in the runbook: the token is a file in the state volume.
          if ($PlanJson -match '(?i)tailscale|TS_|TUNNEL_TOKEN|--token') { 'the plan still carries Tailscale or a token'; exit 1 }
          if ($Plan.stagePlaceHalt -notlike '*no seed, run, task restore or start of windows-rent*UNKNOWN*') { 'stagePlaceHalt differs'; exit 1 }
          # The placement inputs are Stage-only: no other step needs them, and Stage checks them before any change.
          foreach ($P in @($Ast.ParamBlock.Parameters | Where-Object { $_.Name.VariablePath.UserPath -in 'PlacementDistribution', 'PlacementIdentity' })) {
            if (@($P.Attributes | Where-Object { $_.Extent.Text -match 'Mandatory' }).Count) { "$($P.Name) is mandatory beyond Stage"; exit 1 }
          }
          $Text = $Ast.Extent.Text
          $Pre = [regex]::Match($Text, "if \(\`$Step -eq 'Stage'\) \{\s+\`$Problem = Get-PlacementProblem\s+if \(\`$Problem\) \{ throw").Index
          if ($Pre -le 0 -or $Pre -gt $Text.IndexOf('Write-Host "$Step on') -or $Pre -gt $Text.IndexOf('function Get-TaskTarget')) {
            'Stage placement preflight is not before every WSLC call, task change and stop'; exit 1
          }
          # Refusals before any WSLC call.
          foreach ($Bad in @(@{ OldHomeVolume = 'repos' }, @{ OldHomeVolume = 'windows-rent-state' }, @{ OldHomeVolume = 'windows-rent-nix' },
              @{ NixVolume = 'repos' }, @{ NixVolume = 'windows-rent-state' }, @{ SessionId = 'not-a-session' }, @{ OldContainer = 'windows-rent' },
              @{ Candidate = 'windows-rent' }, @{ Candidate = 'envs-dev-mutable' }, @{ Image = 'ghcr.io/roccho-dev/windows-rent:latest' },
              @{ ImportItems = @('codex') }, @{ ImportItems = @('codex', 'codex'); OldImageSource = 'ghcr.io/roccho-dev/envs-dev@sha256:' + ('1' * 64) })) {
            $Refused = $false
            $Args2 = $Base.Clone(); foreach ($K in $Bad.Keys) { $Args2[$K] = $Bad[$K] }
            try { & $Path @Args2 | Out-Null } catch { $Refused = $true }
            if (-not $Refused) { "not refused: $($Bad | ConvertTo-Json -Compress)"; exit 1 }
          }
          # Guards and the Stage/Revert path, taken from the script itself, on synthetic inspect JSON (not recorded WSLC
          # output). Every case reports Mounts=[] as WSLC 2.9.3 was observed to: mounts are never an inspect authority.
          $ReposVolume = 'repos'; $StateVolume = 'windows-rent-state'; $NixVolume = 'windows-rent-nix'; $OldContainer = 'envs-dev-mutable'; $OldHomeVolume = 'dev-home'
          $Container = 'windows-rent'; $Candidate = 'windows-rent-cf'; $OldImageSource = 'ghcr.io/roccho-dev/envs-dev@sha256:' + ('1' * 64)
          foreach ($N in $Ast.FindAll({ param($n)
              ($n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -in 'Get-Images', 'Test-Stopped', 'Test-Running',
                'Get-OldSourceProblem', 'Get-WriterProblem', 'Test-RunningProof', 'Get-StageProblem', 'Get-Container', 'Get-Named',
                'Assert-NoOtherWriter', 'Invoke-Seed', 'Wait-Ready', 'Wait-OldRunning', 'Invoke-Revert', 'Invoke-StageStop', 'Complete-Stage',
                'Get-TaskTarget', 'Set-TaskTarget', 'Invoke-Stage', 'Get-PlacementProblem', 'Get-MountTable', 'Get-RootRelation', 'Get-Anchors',
                'Get-VolumeKind', 'Get-SharingProblem', 'Invoke-Import', 'Assert-OldSourceStopped') -or
              ($n -is [System.Management.Automation.Language.AssignmentStatementAst] -and $n.Left.Extent.Text -in '$Mounts', '$Proof', '$Ready', '$ListArgs', '$SeedArgs', '$TaskName') }, $true)) {
            . ([scriptblock]::Create($N.Extent.Text))
          }
          function J($Text) { $Text | ConvertFrom-Json }
          $Other = 'ghcr.io/roccho-dev/windows-rent@sha256:' + ('2' * 64)
          $Live = 'ghcr.io/roccho-dev/windows-rent@sha256:' + ('d' * 64)
          # Migrate source guard: only an existing, stopped envs-dev-mutable on exactly the pinned source image.
          $Src = '"Config":{"Image":"' + $OldImageSource + '"},"Mounts":[]'
          $Sources = [ordered]@{
            'stopped valid' = @{ Ok = $true; Json = '{"Name":"/envs-dev-mutable","State":{"Running":false,"Status":"exited"},' + $Src + '}' }
            'missing' = @{ Ok = $false; Json = $null }
            'running' = @{ Ok = $false; Json = '{"Name":"envs-dev-mutable","State":{"Running":true,"Status":"running"},' + $Src + '}' }
            'status running' = @{ Ok = $false; Json = '{"Name":"envs-dev-mutable","State":{"Running":false,"Status":"running"},' + $Src + '}' }
            'string state' = @{ Ok = $false; Json = '{"Name":"envs-dev-mutable","State":{"Running":"false"},' + $Src + '}' }
            'wrong image' = @{ Ok = $false; Json = '{"Name":"envs-dev-mutable","State":{"Running":false},"Config":{"Image":"' + $Other + '"},"Mounts":[]}' }
          }
          foreach ($K in $Sources.Keys) {
            $Item = if ($Sources[$K].Json) { J $Sources[$K].Json } else { $null }
            if ([bool] (-not (Get-OldSourceProblem $Item)) -ne $Sources[$K].Ok) { "source guard wrong for '$K'"; exit 1 }
          }
          # Writer guard: every container except the named one must be provably stopped; '' excepts none.
          $Stopped = J '{"Name":"envs-dev-mutable","State":{"Running":false,"Status":"exited"},"Mounts":[]}'
          $RentRunning = J '{"Name":"windows-rent","State":{"Running":true,"Status":"running"},"Mounts":[]}'
          $OtherRunning = J '{"Name":"other","State":{"Running":true,"Status":"running"},"Mounts":[]}'
          if (Get-WriterProblem @($Stopped, $RentRunning)) { 'writer guard refused a stopped source'; exit 1 }
          if (-not (Get-WriterProblem @($Stopped, $OtherRunning))) { 'writer guard allowed another running container'; exit 1 }
          if (-not (Get-WriterProblem @($Stopped, $null))) { 'writer guard allowed an unreadable container'; exit 1 }
          if (-not (Get-WriterProblem @($Stopped, $RentRunning) '')) { 'seed writer guard allowed a running rent container'; exit 1 }
          # With anchors read in the same invocation, a running container is judged by its own PID 1 mount table: same device
          # and a root equal to, above or below a volume's (by path component); overlays only by their upper and work dirs.
          $script:Anchors = @{}
          foreach ($V in 'repos', 'windows-rent-state', 'windows-rent-nix', 'dev-home') { $script:Anchors[$V] = @{ Dev = '8:32'; Root = "/volumes/$V/_data" } }
          $Layer = '/var/lib/docker/overlay2/' + ('a' * 64)
          $RootFs = "1 0 0:45 / / rw,relatime - overlay overlay rw,lowerdir=/var/lib/docker/overlay2/l/A,upperdir=$Layer/diff,workdir=$Layer/work"
          $Proc = '2 1 0:46 / /proc rw,nosuid - proc proc rw'
          $Up = '{"Id":"c1","Name":"/other","State":{"Running":true,"Status":"running","StartedAt":"t1"}}'
          function Vol($Dev, $Root, $Opt) { "3 1 $Dev $Root /x $Opt - ext4 /dev/sdc rw" }
          $Tables = [ordered]@{
            'engine layer, proc and a hosts bind' = @{ Ok = $true; Lines = @($RootFs, $Proc, (Vol '8:32' '/containers/c1/hosts' 'rw')) }
            'same path on another device' = @{ Ok = $true; Lines = @($RootFs, (Vol '8:48' '/volumes/repos/_data' 'rw')) }
            'repos read-only' = @{ Ok = $true; Lines = @($RootFs, (Vol '8:32' '/volumes/repos/_data' 'ro')) }
            'sibling volume name' = @{ Ok = $true; Lines = @($RootFs, (Vol '8:32' '/volumes/reposx/_data' 'rw')) }
            'engine lower layers' = @{ Ok = $true; Lines = @($RootFs.Replace('lowerdir=/var/lib/docker/overlay2/l/A', "lowerdir=/var/lib/docker/overlay2/l/A:$Layer/diff")) }
            'overlay lower on a volume' = @{ Ok = $false; Lines = @($RootFs.Replace('lowerdir=/var/lib/docker/overlay2/l/A', 'lowerdir=/var/lib/docker/volumes/windows-rent-state/_data')) }
            'overlay appended lower layer' = @{ Ok = $false; Lines = @($RootFs.Replace('lowerdir=/var/lib/docker/overlay2/l/A', 'lowerdir+=/var/lib/docker/overlay2/l/A')) }
            'repos writable' = @{ Ok = $false; Lines = @($RootFs, (Vol '8:32' '/volumes/repos/_data' 'rw')) }
            'below repos writable' = @{ Ok = $false; Lines = @($RootFs, (Vol '8:32' '/volumes/repos/_data/sub' 'rw')) }
            'store exposed read-only' = @{ Ok = $false; Lines = @($RootFs, (Vol '8:32' '/volumes' 'ro')) }
            'whole store device exposed' = @{ Ok = $false; Lines = @($RootFs, (Vol '8:32' '/' 'ro')) }
            'overlay upper outside the engine layers' = @{ Ok = $false; Lines = @($RootFs.Replace("upperdir=$Layer/diff", 'upperdir=/volumes/repos/_data')) }
            'malformed line' = @{ Ok = $false; Lines = @($RootFs, 'garbage') }
            'no root mount' = @{ Ok = $false; Lines = @($Proc) }
            'exec fails' = @{ Ok = $false; Lines = @($RootFs); Exit = 1 }
            'restarted while read' = @{ Ok = $false; Lines = @($RootFs); After = $Up.Replace('"t1"', '"t2"') }
          }
          $Wslc = {
            $A = @($args) -join ' '; $global:LASTEXITCODE = 0
            if ($A -ceq 'exec c1 cat /proc/1/mountinfo') { if ($T.Exit) { $global:LASTEXITCODE = $T.Exit }; $T.Lines }
            elseif ($A -ceq 'inspect c1') { if ($T.After) { $T.After } else { $Up } }
            else { $global:LASTEXITCODE = 1 }
          }
          foreach ($K in $Tables.Keys) {
            $T = $Tables[$K]
            $Got = Get-WriterProblem @((J $Up)) 'windows-rent'
            if ([bool] (-not $Got) -ne $T.Ok) { "writer guard wrong for '$K': $Got"; exit 1 }
          }
          # While the typed import runs no container may hold the state volume at all, read-only included.
          $T = @{ Lines = @($RootFs, (Vol '8:32' '/volumes/windows-rent-state/_data' 'ro')) }
          if (Get-WriterProblem @((J $Up)) '' @('windows-rent-state')) { 'a read-only state holder counted as a writer'; exit 1 }
          if (-not (Get-WriterProblem @((J $Up)) '' @('windows-rent-state') @('windows-rent-state'))) { 'the import allowed a state reader'; exit 1 }
          # Nor through an overlay lower layer on the state volume's engine path (not an engine layer: unsupported).
          $T = @{ Lines = @($RootFs.Replace('lowerdir=/var/lib/docker/overlay2/l/A', 'lowerdir=/var/lib/docker/volumes/windows-rent-state/_data')) }
          if (-not (Get-WriterProblem @((J $Up)) '' @('windows-rent-state') @('windows-rent-state'))) { 'the import allowed a state overlay lower'; exit 1 }
          # Anchors from the holder's actual state mount; an unmounted volume takes its sibling root on that device; only the
          # guest driver with empty options, and one device for every volume.
          $HolderJson = '{"Id":"h1","Name":"/windows-rent","State":{"Running":true,"Status":"running","StartedAt":"h"}}'
          $HLines = @($RootFs, '3 1 8:32 /volumes/repos/_data /work/repos rw - ext4 /dev/sdc rw',
            '4 1 8:32 /volumes/windows-rent-state/_data /var/lib/rent rw - ext4 /dev/sdc rw')
          $Driver = 'guest'; $Opts = '{}'
          $Wslc = {
            $A = @($args) -join ' '; $global:LASTEXITCODE = 0
            if ($A -ceq 'exec h1 cat /proc/1/mountinfo') { $HLines }
            elseif ($A -ceq 'inspect h1') { $HolderJson }
            elseif ($A -ceq 'volume inspect windows-rent-nix') { $global:LASTEXITCODE = 1 }
            elseif ($A -clike 'volume inspect *') { '[{"Name":"' + $args[2] + '","Driver":"' + $Driver + '","DriverOpts":' + $Opts + '}]' }
            elseif ($A -ceq 'volume list') { if ($ListExit) { $global:LASTEXITCODE = $ListExit } else { @('DRIVER   VOLUME NAME') + $ListRows + $ListMore } }
            else { $global:LASTEXITCODE = 1 }
          }
          $ListExit = 0; $ListMore = @(); $ListRows = @('guest    repos', 'guest    windows-rent-state', 'guest    dev-home')
          $Got = Get-Anchors (J $HolderJson)
          if (-not $Got -or $Got['windows-rent-nix'].Dev -cne '8:32' -or $Got['windows-rent-nix'].Root -cne '/volumes/windows-rent-nix/_data' -or
              $Got['dev-home'].Root -cne '/volumes/dev-home/_data' -or $Got['repos'].Root -cne '/volumes/repos/_data') { 'anchors not taken from the actual state mount'; exit 1 }
          $Opts = '{"type":"tmpfs"}'; if (Get-Anchors (J $HolderJson)) { 'anchors accepted volume options'; exit 1 }; $Opts = '{}'
          $Driver = 'local'; if (Get-Anchors (J $HolderJson)) { 'anchors accepted another driver'; exit 1 }; $Driver = 'guest'
          $HLines = @($RootFs, '3 1 8:48 /volumes/repos/_data /work/repos rw - ext4 /dev/sdd rw', '4 1 8:32 /volumes/windows-rent-state/_data /var/lib/rent rw - ext4 /dev/sdc rw')
          if (Get-Anchors (J $HolderJson)) { 'anchors accepted volumes on two devices'; exit 1 }
          # A failed inspect is 'absent' only when a readable volume list does not name the volume.
          $ListMore = @('guest    System.Management.Automation.Internal.Host.InternalHost')
          if ((Get-VolumeKind 'windows-rent-nix') -cne 'absent') { 'an unlisted failed volume was not absent'; exit 1 }
          $ListMore = @('guest    windows-rent-nix unexpected'); if ((Get-VolumeKind 'windows-rent-nix') -cne 'unknown') { 'a row with an extra column read as absent'; exit 1 }
          $ListMore = @('guest    windows-rent-nix'); if ((Get-VolumeKind 'windows-rent-nix') -cne 'unknown') { 'a listed failed volume read as absent'; exit 1 }
          $ListMore = @(); $ListExit = 1; if ((Get-VolumeKind 'windows-rent-nix') -cne 'unknown') { 'an unreadable list read as absent'; exit 1 }
          $ListExit = 0; $ListMore = @('malformed-row'); if ((Get-VolumeKind 'windows-rent-nix') -cne 'unknown') { 'a list with an unreadable row read as absent'; exit 1 }
          $ListMore = @(); $Kept = $ListRows; $ListRows = @(); if ((Get-VolumeKind 'windows-rent-nix') -cne 'absent') { 'an empty inventory did not read as absent'; exit 1 }
          $ListRows = $Kept
          $script:Anchors = $null
          # Stage preconditions: the kept rent Running on images read now (never a recorded digest), no candidate yet.
          $OldUpJson = '{"Name":"windows-rent","State":{"Running":true,"Status":"running"},"Image":"sha256:' + ('3' * 64) + '","Config":{"Image":"' + $Live + '"},"Mounts":[]}'
          $OldDownJson = $OldUpJson.Replace('"Running":true,"Status":"running"', '"Running":false,"Status":"exited"')
          $OldUp = J $OldUpJson
          $CandUp = '{"Name":"windows-rent-cf","State":{"Running":true,"Status":"running"},"Config":{"Image":"' + $Image + '"},"Mounts":[]}'
          $CandDown = $CandUp.Replace('"Running":true,"Status":"running"', '"Running":false,"Status":"exited"')
          if (Get-StageProblem $OldUp $null) { "stage refused a running kept rent: $(Get-StageProblem $OldUp $null)"; exit 1 }
          foreach ($Bad in @(@($null, $null), @((J $OldDownJson), $null), @((J '{"Name":"windows-rent","State":{"Running":true}}'), $null),
              @((J $OldUpJson.Replace('"Name":"windows-rent"', '"Name":"other"')), $null),
              @((J ('{"Name":"windows-rent","State":{"Running":true},"Config":{"Image":"' + $Image + '"}}')), $null), @($OldUp, (J $CandDown)))) {
            if (-not (Get-StageProblem $Bad[0] $Bad[1])) { 'stage precondition allowed a bad state'; exit 1 }
          }
          # Placement preflight: plain-file inputs and the one state volume the receiver writes; synthetic files in a fresh
          # runner directory, nothing secret. Each refusal happens before any WSLC call, task change or stop.
          $PD = Join-Path ([IO.Path]::GetTempPath()) "rent-placement-$([guid]::NewGuid())"
          $null = New-Item -ItemType Directory -Path (Join-Path $PD 'ciphertexts')
          foreach ($F in 'place.ps1', 'sops.exe', 'rent-receive.sh', 'identity', 'shell', (Join-Path 'ciphertexts' 'dev-rent-tunnel.sops.yaml')) {
            Set-Content -LiteralPath (Join-Path $PD $F) -Value 'synthetic'
          }
          $PlacementShell = Join-Path $PD 'shell'; $PlacementDistribution = $PD; $PlacementIdentity = Join-Path $PD 'identity'
          if (Get-PlacementProblem) { "placement preflight refused usable inputs: $(Get-PlacementProblem)"; exit 1 }
          foreach ($Bad in @(@{ StateVolume = 'other-state' }, @{ PlacementDistribution = '' }, @{ PlacementIdentity = '' },
              @{ PlacementIdentity = (Join-Path $PD 'missing') }, @{ PlacementIdentity = (Join-Path $PD 'ciphertexts') },
              @{ PlacementShell = (Join-Path $PD 'missing') }, @{ PlacementDistribution = (Join-Path $PD 'ciphertexts') })) {
            $Keep = @{ StateVolume = $StateVolume; PlacementDistribution = $PlacementDistribution; PlacementIdentity = $PlacementIdentity; PlacementShell = $PlacementShell }
            foreach ($K in $Bad.Keys) { Set-Variable -Name $K -Value $Bad[$K] }
            $Problem = Get-PlacementProblem
            foreach ($K in $Keep.Keys) { Set-Variable -Name $K -Value $Keep[$K] }
            if (-not $Problem) { "placement preflight allowed: $($Bad | ConvertTo-Json -Compress)"; exit 1 }
          }
          # Placement takes paths only: with real input paths the plan names them, never what they hold.
          Set-Content -LiteralPath $PlacementIdentity -Value 'AGE-SECRET-KEY-1CISYNTHETICMARKER'
          Set-Content -LiteralPath (Join-Path $PD (Join-Path 'ciphertexts' 'dev-rent-tunnel.sops.yaml')) -Value 'ci-synthetic-envelope-marker'
          $PathPlan = (& $Path @Base -PlacementDistribution $PD -PlacementIdentity $PlacementIdentity) -join "`n"
          if ($PathPlan -match 'CISYNTHETICMARKER|ci-synthetic-envelope-marker') { 'the plan carries placement file contents'; exit 1 }
          if (@(($PathPlan | ConvertFrom-Json).stagePlace) -cnotcontains $PlacementIdentity) { 'stagePlace does not name the identity path'; exit 1 }
          # Ready gate: Running with both lines, nothing less.
          $Up = J $CandUp
          if (-not (Test-RunningProof $Up @('x', "$Proof`r", $Ready))) { 'ready gate refused a proven start'; exit 1 }
          foreach ($Bad in @(@($Up, @($Proof)), @($Up, @($Ready)), @((J $CandDown), @($Proof, $Ready)), @($null, @($Proof, $Ready)),
              @((J '{"State":{"Running":"true"}}'), @($Proof, $Ready)))) {
            if (Test-RunningProof $Bad[0] $Bad[1]) { 'ready gate passed without proof'; exit 1 }
          }
          # The one logon task, on mocked ScheduledTasks cmdlets: readback of its target, refusal of anything but one exact
          # 'wslc start <name>' action, re-registration of the same name only, and a readback that must match.
          $Wslc = $W
          $Store = @{ Tasks = @(); Registered = @(); Ignore = $false }
          function Get-ScheduledTask { $Store.Tasks }
